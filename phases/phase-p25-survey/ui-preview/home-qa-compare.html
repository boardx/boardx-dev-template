<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Survey 首页同屏对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #181818; color: #fff; font: 14px Arial, sans-serif; }
    header { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 14px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 12px; }
    figure { margin: 0; overflow: hidden; background: #fff; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <header><strong>参考首页</strong><strong>HTML 原型</strong></header>
  <main>
    <figure><img src="source-home-reference-latest.png" alt="参考首页"></figure>
    <figure><img src="prototype-current-home-2048.png" alt="HTML 原型"></figure>
  </main>
</body>
</html>
