<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BoardX Survey 交互原型</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #6f7378;
      --line: #e4e6e8;
      --line-strong: #d5d8dc;
      --panel: #ffffff;
      --wash: #f7f8f8;
      --soft: #f1f2f3;
      --green: #16a85b;
      --green-soft: #eaf8f0;
      --orange: #e99217;
      --red: #df3b3b;
      --blue: #306acb;
      --shadow: 0 1px 2px rgba(0,0,0,.04);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: var(--wash);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; font-size: 14px; letter-spacing: 0; }
    button, input, textarea, select { font: inherit; color: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid rgba(23,23,23,.28);
      outline-offset: 2px;
    }
    .app {
      display: grid;
      grid-template-rows: 76px 108px minmax(0, 1fr);
      height: 100vh;
      min-width: 1120px;
      background: var(--wash);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.98);
    }
    .brand-row, .actions, .inline, .meta-row, .field-row { display: flex; align-items: center; }
    .brand-row { min-width: 0; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 20px; font-weight: 720; }
    .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 8px; background: #111; color: #fff; font-weight: 800; }
    .top-divider { width: 1px; height: 30px; background: var(--line-strong); }
    .survey-name { max-width: 460px; overflow: hidden; font-size: 17px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .workflow-badge { display: inline-flex; min-height: 28px; align-items: center; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px; background: #fafafa; font-size: 13px; font-weight: 650; }
    .saved { display: inline-flex; align-items: center; gap: 7px; color: var(--green); font-weight: 650; white-space: nowrap; }
    .saved-dot { display: grid; width: 17px; height: 17px; place-items: center; border: 1.5px solid currentColor; border-radius: 50%; font-size: 11px; }
    .actions { gap: 10px; }
    .btn {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      color: inherit;
      font-weight: 620;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: border-color .16s, background .16s, color .16s, transform .16s;
    }
    .btn:hover { border-color: #aeb2b7; background: #fafafa; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { border-color: #111; background: #111; color: #fff; }
    .btn.primary:hover { background: #292929; }
    .btn.danger { color: var(--red); }
    .btn.small { min-height: 32px; padding: 0 11px; font-size: 12px; }
    .btn.icon { width: 34px; min-height: 34px; padding: 0; }
    .btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
    .btn.dashed { width: 100%; border-style: dashed; }
    .workflow {
      display: grid;
      grid-template-columns: repeat(5, minmax(150px, 1fr));
      gap: 10px;
      align-items: center;
      padding: 14px 30px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .step {
      position: relative;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-height: 78px;
      padding: 12px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      text-align: left;
    }
    .step-num { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 7px; background: var(--soft); font-weight: 720; }
    .step.active { border-color: #1d1d1d; background: #1d1d1d; color: #fff; }
    .step.active .step-num { background: #fff; color: #171717; }
    .step.active .step-desc { color: rgba(255,255,255,.62); }
    .step-label { display: block; font-weight: 720; }
    .step-desc { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .workspace { display: grid; min-height: 0; grid-template-columns: 56px 286px minmax(540px, 1fr) 318px; }
    .rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-right: 1px solid var(--line);
      background: #fff;
    }
    .rail-pill { display: grid; width: 36px; min-height: 36px; place-items: center; border-radius: 7px; background: var(--soft); font-size: 18px; }
    .rail-count { font-weight: 720; }
    .side, .ai {
      min-height: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #fff;
    }
    .ai { border-right: 0; border-left: 1px solid var(--line); }
    .side-head, .ai-head, .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .side-head { position: sticky; top: 0; z-index: 2; padding: 18px 16px 12px; background: #fff; }
    .side-title { font-size: 16px; font-weight: 760; }
    .outline { display: grid; gap: 8px; padding: 0 12px 18px; }
    .outline-item {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 11px;
      align-items: center;
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #fff;
      text-align: left;
      transition: background .15s, border-color .15s;
    }
    .outline-item:hover { border-color: var(--line); background: var(--wash); }
    .outline-item.active { border-color: #111; background: #111; color: #fff; }
    .outline-num { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 7px; background: var(--soft); font-weight: 720; color: var(--ink); }
    .outline-label { display: block; overflow: hidden; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
    .outline-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .outline-item.active .outline-meta { color: rgba(255,255,255,.7); }
    .main { min-width: 0; min-height: 0; overflow: auto; background: var(--wash); }
    .main-inner { width: min(100%, 980px); margin: 0 auto; padding: 24px 24px 80px; }
    .eyebrow { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border-radius: 6px; background: var(--soft); font-size: 12px; font-weight: 680; }
    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 14px; font-size: 26px; line-height: 1.25; }
    h2 { font-size: 20px; line-height: 1.3; }
    h3 { font-size: 15px; line-height: 1.35; }
    .subcopy { margin-top: 10px; color: var(--muted); line-height: 1.7; }
    .meta-row { flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .chip { display: inline-flex; min-height: 28px; align-items: center; gap: 6px; padding: 0 9px; border-radius: 6px; background: var(--soft); color: #4f5459; font-size: 12px; }
    .chip.green { background: var(--green-soft); color: var(--green); font-weight: 650; }
    .card { border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: var(--shadow); }
    .editor { margin-top: 22px; }
    .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .editor-title { display: flex; align-items: center; gap: 10px; }
    .editor-actions { display: flex; flex-wrap: wrap; gap: 3px; }
    .editor-body { display: grid; gap: 18px; padding: 20px; }
    .field-grid { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 18px; }
    .field { display: grid; gap: 8px; min-width: 0; }
    .field label { color: #565b60; font-size: 12px; font-weight: 620; }
    .required { color: var(--red); }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], textarea, select {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      transition: border-color .16s, box-shadow .16s;
    }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], select { height: 42px; padding: 0 12px; }
    textarea { min-height: 92px; resize: vertical; padding: 12px; line-height: 1.6; }
    input:focus, textarea:focus, select:focus { border-color: #888; box-shadow: 0 0 0 3px rgba(0,0,0,.05); outline: 0; }
    .check { display: inline-flex; align-items: center; gap: 9px; font-weight: 620; }
    .check input { width: 17px; height: 17px; accent-color: #111; }
    .counted { position: relative; }
    .count { position: absolute; right: 11px; bottom: 9px; color: #9a9da1; font-size: 12px; }
    .advanced { width: 100%; padding: 14px 20px; border: 0; border-top: 1px solid var(--line); background: #fff; font-weight: 650; text-align: left; }
    .advanced:hover { background: var(--wash); }
    .settings-reveal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px 20px; border-top: 1px solid var(--line); background: #fafafa; }
    .settings-reveal label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .ai-detail-list { display: grid; gap: 8px; margin-top: 12px; padding: 12px; border-radius: 6px; background: var(--wash); color: #555b60; font-size: 12px; line-height: 1.5; }
    .editable { border-radius: 6px; box-shadow: 0 0 0 2px rgba(48,106,203,.24); outline: 0; }
    .add-bottom { display: flex; justify-content: center; padding: 16px 20px; border-top: 1px solid var(--line); }
    .page-foot { margin-top: 26px; color: #8a8d91; text-align: center; }
    .ai { padding: 18px 16px; }
    .ai-head { margin-bottom: 12px; }
    .ai-title { font-size: 16px; font-weight: 760; }
    .ai-copy { margin-bottom: 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .ai-compose { position: relative; }
    .ai-compose textarea { min-height: 102px; padding-right: 44px; }
    .ai-send { position: absolute; right: 9px; bottom: 9px; width: 32px; height: 32px; border: 0; border-radius: 7px; background: #111; color: #fff; font-weight: 800; }
    .ai-status, .ai-result { margin-top: 14px; padding: 16px; }
    .status-line { display: flex; align-items: center; gap: 9px; }
    .spinner { width: 20px; height: 20px; border: 2px solid #cfeeda; border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success-icon { display: grid; width: 20px; height: 20px; place-items: center; border: 1.5px solid var(--green); border-radius: 50%; color: var(--green); font-size: 12px; }
    .ai-result p { margin-top: 12px; color: var(--muted); line-height: 1.6; }
    .ai-result .actions { margin-top: 16px; }
    .ai-collapsed { display: none; }
    .template-layout, .responses-layout, .report-layout { display: grid; min-height: 100%; }
    .template-canvas { margin-top: 18px; padding: 14px; background-image: linear-gradient(#edf0f2 1px, transparent 1px), linear-gradient(90deg,#edf0f2 1px,transparent 1px); background-size: 22px 22px; }
    .source-list { display: grid; gap: 7px; margin-top: 14px; }
    .source-row { display: flex; min-height: 38px; align-items: center; gap: 12px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 16px 0 10px; }
    .module-grid { display: grid; grid-template-columns: 1.25fr .8fr; gap: 12px; }
    .module { min-height: 260px; padding: 15px; }
    .bars { display: flex; height: 150px; align-items: end; justify-content: space-around; gap: 10px; padding: 20px 8px 0; border-bottom: 1px solid var(--line-strong); }
    .bar-group { display: flex; height: 100%; align-items: end; gap: 4px; }
    .bar { width: 16px; border-radius: 2px 2px 0 0; background: var(--blue); }
    .bar.alt { background: #25a866; }
    .donut { display: grid; width: 150px; height: 150px; margin: 20px auto; place-items: center; border-radius: 50%; background: conic-gradient(var(--blue) 0 53%, #25a866 53% 100%); }
    .donut::after { display: grid; width: 76px; height: 76px; place-items: center; border-radius: 50%; background: #fff; content: "118"; font-size: 22px; font-weight: 760; }
    .setting-panel { margin-top: 12px; padding: 16px; }
    .setting-list { display: grid; gap: 16px; margin-top: 16px; }
    .segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
    .segment { min-height: 40px; border: 0; border-right: 1px solid var(--line); background: #fff; }
    .segment:last-child { border-right: 0; }
    .segment.active { background: #111; color: #fff; }
    .publish-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; margin-top: 20px; }
    .publish-card { padding: 18px; }
    .publish-link { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; margin-top: 14px; }
    .checks { display: grid; margin-top: 10px; }
    .check-row { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .check-row:last-child { border-bottom: 0; }
    .green-check { display: grid; width: 19px; height: 19px; place-items: center; border: 1.5px solid var(--green); border-radius: 50%; color: var(--green); font-size: 11px; }
    .form-stack { display: grid; gap: 16px; margin-top: 18px; }
    .toggle { position: relative; width: 44px; height: 24px; border: 0; border-radius: 999px; background: #bbb; }
    .toggle::after { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; content: ""; transition: transform .18s; }
    .toggle.on { background: #111; }
    .toggle.on::after { transform: translateX(20px); }
    .counter { display: inline-grid; grid-template-columns: 36px 70px 36px; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
    .counter button, .counter span { display: grid; min-height: 38px; place-items: center; border: 0; background: #fff; }
    .counter span { border-right: 1px solid var(--line); border-left: 1px solid var(--line); }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 16px; }
    .metric { padding: 15px 18px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-value { font-size: 24px; font-weight: 760; }
    .metric-label { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .filters { display: grid; grid-template-columns: minmax(220px,1fr) auto auto auto; gap: 9px; margin: 12px 0; }
    .table-wrap { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 650; }
    tr.selectable { cursor: pointer; }
    tr.selectable:hover, tr.selected { background: #f1f6ff; }
    .quality { display: inline-flex; align-items: center; gap: 6px; }
    .quality::before { width: 7px; height: 7px; border-radius: 50%; background: var(--green); content: ""; }
    .quality.warn::before { background: var(--orange); }
    .quality.bad::before { background: var(--red); }
    .detail { padding: 16px; }
    .detail-grid { display: grid; grid-template-columns: 100px minmax(0,1fr); gap: 10px; margin-top: 14px; font-size: 12px; }
    .detail-grid dt { color: var(--muted); }
    .detail-grid dd { margin: 0; }
    .answer-block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .answer-line { display: flex; justify-content: space-between; gap: 18px; padding: 7px 0; font-size: 12px; }
    .report-progress { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 14px; }
    .progress-bars { display: grid; flex: 1; grid-template-columns: repeat(8,1fr); gap: 6px; }
    .progress-bars span { height: 4px; border-radius: 3px; background: var(--line-strong); }
    .progress-bars .done { background: var(--green); }
    .progress-bars .working { background: #efc27f; }
    .report-paper { margin-top: 14px; padding: 18px; }
    .report-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .report-kpi { padding: 14px; }
    .finding { margin-top: 12px; padding: 16px; }
    .finding ul { margin: 10px 0 0; padding-left: 20px; color: #484d52; line-height: 1.8; }
    .app.preview-only { display: block; min-width: 0; height: 100vh; }
    .app.preview-only .topbar, .app.preview-only .workflow { display: none; }
    .app.preview-only .workspace { height: 100vh; }
    .workspace.preview-mode { display: block; overflow: auto; background: #f4f4f4; }
    .preview-shell { width: min(calc(100% - 32px), 920px); margin: 0 auto; padding: 32px 0 72px; }
    .preview-paper-wrap { width: 100%; margin: 0 auto; }
    .preview-paper { overflow: hidden; border: 0; border-radius: 8px; background: #fff; box-shadow: var(--shadow); }
    .preview-banner { position: relative; height: 96px; overflow: hidden; }
    .preview-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .preview-banner-content { position: relative; display: flex; height: 100%; align-items: center; justify-content: space-between; padding: 0 28px; color: #fff; }
    .preview-brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 720; }
    .preview-brand-icon { font-size: 24px; line-height: 1; }
    .preview-label { padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,.15); font-size: 12px; font-weight: 620; }
    .preview-form { width: min(100%, 760px); margin: 0 auto; padding: 32px 28px 42px; }
    .preview-progress-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
    .preview-progress-head strong { color: var(--ink); }
    .survey-progress { width: 100%; height: 4px; margin-top: 12px; overflow: hidden; border: 0; border-radius: 99px; background: #ededed; appearance: none; }
    .survey-progress::-webkit-progress-bar { border-radius: 99px; background: #ededed; }
    .survey-progress::-webkit-progress-value { border-radius: 99px; background: #6745e8; }
    .survey-progress::-moz-progress-bar { border-radius: 99px; background: #6745e8; }
    .preview-intro { padding: 32px 0 34px; }
    .preview-intro h1 { margin: 0; font-size: 30px; }
    .preview-intro p { margin-top: 10px; color: var(--muted); line-height: 1.7; }
    .answer-question { padding: 12px 0; }
    .answer-question-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px; font-size: 15px; font-weight: 680; }
    .answer-question-type { color: var(--muted); font-size: 12px; font-weight: 400; }
    .answer-options { display: grid; gap: 8px; margin-top: 10px; }
    .answer-option { display: flex; min-height: 44px; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 6px; background: #f7f7f7; }
    .answer-option input { width: 17px; height: 17px; margin: 0; accent-color: #6745e8; }
    .answer-text, .answer-paragraph { margin-top: 10px; border-width: 0 0 1px; border-radius: 0; padding-right: 0; padding-left: 0; box-shadow: none; }
    .answer-paragraph { min-height: 80px; }
    .answer-scale { display: grid; grid-template-columns: repeat(11, minmax(34px, 1fr)); gap: 6px; margin-top: 10px; }
    .answer-scale.rating { display: flex; }
    .answer-scale button { min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .answer-scale.rating button { width: 42px; color: #b9bbc0; font-size: 21px; }
    .answer-scale button:hover, .answer-scale button.selected { border-color: #9a87ee; background: #f6f3ff; color: #6745e8; }
    .preview-submit { display: flex; justify-content: flex-end; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 30; min-width: 240px; padding: 13px 16px; border-radius: 7px; background: #111; color: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.2); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .2s, transform .2s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .hidden { display: none !important; }
    .app.home-mode { display: block; min-width: 1120px; }
    .app.home-mode .topbar, .app.home-mode .workflow { display: none; }
    .app.home-mode .workspace { display: block; height: 100vh; }
    .home-shell { display: grid; height: 100%; grid-template-columns: clamp(300px, 20.5vw, 410px) minmax(0, 1fr); background: #f6f6f6; }
    .global-rail {
      display: flex;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      padding: 18px 7px 12px;
      border-right: 1px solid var(--line);
      background: #f4f4f4;
    }
    .global-logo { width: 34px; height: 34px; margin-bottom: 22px; object-fit: contain; }
    .global-link {
      display: grid;
      width: 46px;
      min-height: 52px;
      place-items: center;
      gap: 3px;
      margin-bottom: 3px;
      padding: 7px 2px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #686c70;
      font-size: 9px;
    }
    .global-link b { font-size: 16px; font-weight: 500; }
    .global-link.active { background: #e8e8e8; color: #202020; }
    .global-bottom { display: grid; gap: 7px; margin-top: auto; }
    .global-bottom .global-link { min-height: 38px; margin: 0; }

<body>
  <div class="app">
    <header class="topbar">

  <div class="toast" id="toast" role="status"></div>

  <script>
    const surveyTitle = "商品反馈问卷";
    const questionTypes = ["短文本", "段落", "邮箱", "数字", "手机号", "单选", "多选", "下拉", "评分", "线性量表", "NPS", "日期", "时间", "文件上传"];
    const state = {
      step: "home",

      templateFilter: "全部",
      selectedQuestion: 0,
      previewing: false,
      previewAnswers: {},
      aiCollapsed: false,
      sideCollapsed: true,
      saveTimer: null,
      published: false,
      limit: 200,
      chapter: 0,
      module: "chart",
      response: 0,
      responsePage: 1,
      responseView: 0,
      customResponseViews: [],
      responseDetailOpen: true,
      responseQuery: "",
      publishSection: 0,
      reportChapter: 1,
      reportEditing: false,
      advancedOpen: false,
      chapterSettingsOpen: false,
      templateSourcesOpen: true,
      aiDetailsOpen: false,
      questions: [
        { title: "您之前是否使用过同类商品？", type: "单选", required: true, desc: "行为习惯", options: ["经常使用", "偶尔使用", "第一次使用"] },
        { title: "您购买或试用这款新品的主要原因是什么？", type: "多选", required: true, desc: "偏好", options: ["功能吸引", "价格合适", "朋友推荐", "品牌信任"] },

        ["R-0118", "李四（家长）", "2025-05-24 09:37", "7分48秒", "100%", "优秀", "正常"],

      ]
    };

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));

    function toast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove("show"), 1900);
    }

    function markDirty() {
      const saveText = $("#saveText");
      if (saveText) saveText.textContent = "保存中…";
      clearTimeout(state.saveTimer);

    function questionCard(question, index, categories) {

        return `<div class="answer-scale rating" role="group" aria-label="问题 ${index + 1} 评分">${Array.from({length:5}, (_, value) => `<button class="${Number(answer) === value + 1 ? "selected" : ""}" data-action="preview-rating" data-preview-question="${index}" data-preview-value="${value + 1}" type="button" aria-label="${value + 1} 星">★</button>`).join("")}</div>`;

        return `<div class="answer-scale" role="group" aria-label="问题 ${index + 1} NPS 评分">${Array.from({length:11}, (_, value) => `<button class="${Number(answer) === value ? "selected" : ""}" data-action="preview-nps" data-preview-question="${index}" data-preview-value="${value}" type="button">${value}</button>`).join("")}</div>`;

      const chapterTitle = chapters[state.reportChapter];
      return `<main class="main"><div class="main-inner" style="max-width:1120px">
        <div class="section-head"><h1 style="margin:0">分析报告</h1><div class="actions"><button class="btn" data-action="regenerate" type="button">重新生成</button><button class="btn" data-action="export-report" type="button">导出⌄</button><button class="btn primary" data-action="full-report" type="button">生成完整报告</button></div></div>
        <section class="report-progress card"><strong>总进度　6/8</strong><div class="progress-bars">${Array.from({length:8},(_,i)=>`<span class="${i<6?"done":i===6?"working":""}"></span>`).join("")}</div><span style="color:var(--muted)">预计还需 3–5 分钟</span></section>
        <section class="report-paper card"><div class="section-head"><div><span class="eyebrow">第 ${state.reportChapter + 1} 章</span><h2 style="margin-top:8px">${chapterTitle}</h2></div><div class="actions"><button class="btn small" data-action="rewrite" type="button">AI 改写</button><button class="btn small" data-action="edit-report" type="button">${state.reportEditing ? "完成编辑" : "编辑"}</button><button class="btn small" data-action="regenerate" type="button">重新生成</button></div></div><p class="subcopy ${state.reportEditing ? "editable" : ""}" contenteditable="${state.reportEditing}">本章基于 118 份有效回收样本，呈现学生在性别、年级、生源性别分布等基础特征。</p><div class="report-kpis"><div class="report-kpi card"><span class="metric-label">有效样本</span><div class="metric-value">118 <small>人</small></div></div><div class="report-kpi card"><span class="metric-label">完成率</span><div class="metric-value">94.4%</div></div><div class="report-kpi card"><span class="metric-label">平均用时</span><div class="metric-value">4分32秒</div></div></div><div class="module-grid" style="margin-top:12px"><article class="module card"><h3>学生基础信息分布</h3><div class="bars">${[38,62,76,96,88,66].map((h)=>`<span class="bar-group"><i class="bar" style="height:${h}%"></i><i class="bar alt" style="height:${Math.max(h-10,20)}%"></i></span>`).join("")}</div></article><article class="module card"><h3>生源性别分布</h3><div class="donut"></div></article></div><article class="finding card ${state.reportEditing ? "editable" : ""}" contenteditable="${state.reportEditing}"><h3>关键发现</h3><ul><li>性别分布较为均衡，差异在样本范围内较小。</li><li>四年级样本量相对较高，可重点关注该年级群体的行为与发展特征。</li><li>低年级样本量偏少，跨年级比较时需结合实际样本量审慎判断。</li></ul></article></section>
      </div></main>`;
    }

    function render() {
      const app = $(".app");
      const workspace = $("#workspace");
      const home = state.step === "home";
      const designMode = state.step === "design" && !state.previewing;
      app.classList.toggle("home-mode", home);
      app.classList.toggle("preview-only", state.step === "design" && state.previewing);
      $("#previewBtn").classList.toggle("hidden", !designMode);
      $("#saveBtn").classList.toggle("hidden", !designMode);
      if (home) {
        workspace.classList.remove("design-mode");
        workspace.classList.remove("preview-mode");
        workspace.innerHTML = homeScreen();
        workspace.style.gridTemplateColumns = "";
        bind();
        $(".home-main").scrollTop = 0;
        return;
      }
      $$(".step").forEach(step => step.classList.toggle("active", step.dataset.step === state.step));
      if (state.step === "design") {
        workspace.classList.toggle("design-mode", !state.previewing);
        workspace.classList.toggle("preview-mode", state.previewing);
        workspace.innerHTML = state.previewing ? previewWorkspace() : designWorkspace();
        workspace.style.gridTemplateColumns = "";
        bind();
        workspace.scrollTop = 0;
        return;
      }
      workspace.classList.remove("design-mode");
      workspace.classList.remove("preview-mode");
      const pieces = {
        template: [chapterSide(), templateMain(), aiPanel("template")],
        publish: [publishSide(), publishMain(), aiPanel("publish")],
        responses: [responseSide(), responsesMain(), aiPanel("responses")],
        report: [reportSide(), reportMain(), aiPanel("report")]
      }[state.step];
      workspace.innerHTML = rail() + (state.sideCollapsed ? "" : pieces[0]) + pieces[1] + pieces[2];
      workspace.style.gridTemplateColumns = state.sideCollapsed ? "56px minmax(540px,1fr) 318px" : "";
      bind();
      $(".main").scrollTop = 0;
    }

    function setStep(step) {
      state.step = step;
      state.previewing = false;
      render();
      history.replaceState(null, "", `#${step}`);
    }

    function setDashboard(view) {
      state.step = "home";
      state.dashboardView = view;
      state.createModal = false;
      render();
      history.replaceState(null, "", `#${view === "home" ? "home" : view}`);
    }

    function moveQuestion(direction) {
      const current = state.selectedQuestion;
      const target = current + direction;
      if (target < 0 || target >= state.questions.length) return;
      [state.questions[current], state.questions[target]] = [state.questions[target], state.questions[current]];
      state.selectedQuestion = target;
      markDirty();
      renderPreservingScroll();
    }

    function bind() {
      $$("[data-question]").forEach(el => el.onclick = () => { state.selectedQuestion = Number(el.dataset.question); render(); });
      $$("[data-chapter]").forEach(el => el.onclick = () => { state.chapter = Number(el.dataset.chapter); render(); });
      $$("[data-response]").forEach(el => el.onclick = () => { state.response = Number(el.dataset.response); state.responseDetailOpen = true; render(); });
      $$("[data-module]").forEach(el => el.onclick = () => { state.module = el.dataset.module; toast(`已切换为${el.textContent}模块`); render(); });
      $$("[data-segment-group] .segment").forEach(el => el.onclick = () => { $$(".segment", el.parentElement).forEach(x => x.classList.remove("active")); el.classList.add("active"); markDirty(); });
      $$("[data-action]").forEach(el => el.addEventListener("click", () => handleAction(el.dataset.action, el)));
      $$("[data-preview-input]").forEach(element => {
        const eventName = element.tagName === "TEXTAREA" || element.type === "text" ? "input" : "change";
        element.addEventListener(eventName, () => {
          const questionIndex = Number(element.dataset.previewQuestion);
          if (element.type === "checkbox") {
            state.previewAnswers[questionIndex] = $$(`[data-preview-input][data-preview-question="${questionIndex}"]:checked`).map(input => input.value);
          } else {
            state.previewAnswers[questionIndex] = element.value;
          }
          updatePreviewProgress();
        });
      });

      $$("[data-question-title]").forEach(element => {
        element.oninput = (event) => {
          const question = state.questions[Number(element.dataset.questionTitle)];
          question.title = event.target.value;
          $(".count", event.target.parentElement).textContent = `${question.title.length}/200`;
          markDirty();
        };
      });
      $$("[data-question-option]").forEach(element => {
        element.oninput = (event) => {
          const question = state.questions[Number(element.dataset.questionOption)];
          question.options[Number(element.dataset.optionIndex)] = event.target.value;
          markDirty();
        };
      });
      $$("[data-question-placeholder]").forEach(element => {
        element.oninput = (event) => {
          state.questions[Number(element.dataset.questionPlaceholder)].placeholder = event.target.value;
          markDirty();
        };
      });
      $$("[data-question-type]").forEach(element => {
        element.onchange = (event) => {
          const question = state.questions[Number(element.dataset.questionType)];
          question.type = event.target.value;
          if (["单选", "多选", "下拉"].includes(question.type) && !question.options) question.options = ["选项 1", "选项 2"];
          if (!["单选", "多选", "下拉"].includes(question.type)) delete question.options;
          markDirty();
          renderPreservingScroll();
        };
      });
      $$("[data-question-category]").forEach(element => {
        element.onchange = (event) => {
          state.questions[Number(element.dataset.questionCategory)].desc = event.target.value;
          markDirty();
          renderPreservingScroll();
        };
      });
      $$("[data-question-required]").forEach(element => {
        element.onchange = (event) => {
          state.questions[Number(element.dataset.questionRequired)].required = event.target.checked;
          markDirty();
        };
      });

      const q = state.questions[state.selectedQuestion];
      const desc = $("#questionDesc");
      if (desc) desc.oninput = (event) => { q.desc = event.target.value; $(".count", event.target.parentElement).textContent = `${q.desc.length}/500`; markDirty(); };
      const placeholder = $("#questionPlaceholder");
      if (placeholder) placeholder.oninput = (event) => { q.placeholder = event.target.value; $(".count", event.target.parentElement).textContent = `${q.placeholder.length}/50`; markDirty(); };
      const responseSearch = $("#responseSearch");
      if (responseSearch) responseSearch.onkeydown = (event) => {
        if (event.key === "Enter") {
          state.responseQuery = event.target.value.trim();
          render();
        }
      };
      const responseStatus = $("#responseStatus");
      if (responseStatus) responseStatus.onchange = (event) => {
        state.responseView = event.target.value === "需复核" ? 2 : event.target.value === "无效" ? 4 : 0;
        render();
      };
    }

    function renderPreservingScroll() {
      const workspace = $("#workspace");
      const scrollTop = workspace.scrollTop;
      render();
      workspace.scrollTop = scrollTop;
    }

    function updatePreviewProgress() {
      const answered = previewAnsweredCount();
      const progress = $("#previewProgress");
      const text = $("#previewProgressText");
      if (progress) progress.value = answered;
      if (text) text.textContent = `${answered} / ${state.questions.length}`;
    }

    function handleAction(action, element) {
      if (element.dataset.questionIndex !== undefined) {
        state.selectedQuestion = Number(element.dataset.questionIndex);
      }
      if (action === "home") {
        setDashboard("home");
      } else if (action === "home-create") {
        state.createModal = true;
        render();
      } else if (action === "home-templates") {
        setDashboard("templates");
      } else if (action === "home-my") {
        setDashboard("my");
      } else if (action === "home-report-templates") {
        setDashboard("reportTemplates");
      } else if (action === "home-insights") {
        setDashboard("insights");
      } else if (action === "close-create") {
        state.createModal = false;
        render();
      } else if (action === "create-template") {
        setDashboard("templates");
      } else if (action === "create-ai") {
        state.createModal = false;
        state.sideCollapsed = true;
        setStep("design");
        toast("已进入 AI 辅助问卷编辑");
      } else if (action === "create-blank") {
        state.createModal = false;
        state.sideCollapsed = true;
        setStep("design");
        toast("已创建空白问卷草稿");
      } else if (action === "continue-edit") {
        state.sideCollapsed = true;
        state.selectedQuestion = Math.min(Number(element.dataset.survey) || 0, state.questions.length - 1);
        setStep("design");
      } else if (action === "template-filter") {
        state.templateFilter = element.dataset.filter;
        render();
      } else if (action === "template-start") {
        state.sideCollapsed = true;
        setStep("design");
        toast(`已使用模版 ${Number(element.dataset.template) + 1} 创建问卷草稿`);
      } else if (action === "view-report-template" || action === "open-report-template" || action === "new-report-template") {
        state.sideCollapsed = false;
        setStep("template");
      } else if (action === "refresh-insights") {
        toast("洞察报告已刷新");
      } else if (action === "generate-report" || action === "open-ai-report") {
        setStep("report");
      } else if (action === "report-overview") {
        toast("当前显示报告概览");
      } else if (action === "report-responses") {
        setStep("responses");
      } else if (action === "global-home" || action === "global-rooms" || action === "global-ava" || action === "global-store") {
        toast("此原型聚焦 Survey，已保留 BoardX 全局导航入口");
      } else if (action === "feedback") {
        toast("反馈入口已打开");
      } else if (action === "theme") {
        document.documentElement.classList.toggle("dark-preview");
        toast("已切换界面主题预览");
      } else if (action === "account") {
        toast("账号：shen");
      } else if (action === "return-list") {
        setDashboard("my");
      } else if (action === "edit-survey") {
        closePreview();
      } else if (action === "save-changes") {
        toast("问卷修改已保存");
      } else if (action === "ai-prompt") {
        const input = $("#aiInput");
        if (input) input.value = element.dataset.prompt;
        toast(`已填入：${element.dataset.prompt}`);
      } else if (action === "outline-menu") {
        toast("题目菜单：批量设置、导入题目、清空问卷");
      } else if (action === "add-hypothesis") {
        toast("已添加一条待编辑的诊断假设");
      } else if (action === "add-option") {
        const current = state.questions[state.selectedQuestion];
        current.options = [...(current.options || []), `新选项 ${(current.options || []).length + 1}`];
        markDirty();
        renderPreservingScroll();
      } else if (action === "nps-preview") {
        toast(`NPS 预览选择：${element.textContent}`);
      } else if (action === "rating-preview") {
        toast(`评分预览选择：${element.dataset.rating} 星`);
      } else if (action === "preview-rating" || action === "preview-nps") {
        const questionIndex = Number(element.dataset.previewQuestion);
        state.previewAnswers[questionIndex] = Number(element.dataset.previewValue);
        $$(`[data-preview-question="${questionIndex}"][data-action]`).forEach(button => button.classList.toggle("selected", button === element));
        updatePreviewProgress();
      } else if (action === "submit-preview") {
        const answered = previewAnsweredCount();
        toast(answered === state.questions.length ? "预览答卷已完成" : `已回答 ${answered} / ${state.questions.length} 题`);
      } else if (action === "toggle-advanced") {
        state.advancedOpen = !state.advancedOpen;
        render();
      } else if (action === "ai-details") {
        state.aiDetailsOpen = !state.aiDetailsOpen;
        render();
      } else if (action === "chapter-settings") {
        state.chapterSettingsOpen = !state.chapterSettingsOpen;
        render();
      } else if (action === "source-toggle") {
        state.templateSourcesOpen = !state.templateSourcesOpen;
        render();
      } else if (action === "module-menu") {
        toast("模块菜单：复制、替换类型、删除模块");
      } else if (action === "publish-section") {
        state.publishSection = Number(element.dataset.publishSection);
        render();
        toast(["发布状态", "回收范围", "回收规则", "完成页面"][state.publishSection]);
      } else if (action === "add-response-view") {
        state.customResponseViews.push(`自定义视图 ${state.customResponseViews.length + 1}`);
        state.responseView = 4 + state.customResponseViews.length;
        render();
        toast("已添加自定义答卷视图");
      } else if (action === "response-view") {
        state.responseView = Number(element.dataset.responseView);
        render();
      } else if (action === "filter-responses") {
        state.responseQuery = $("#responseSearch")?.value.trim() || "";
        render();
        toast(state.responseQuery ? `已筛选：${state.responseQuery}` : "已显示全部答卷");
      } else if (action === "close-response") {
        state.responseDetailOpen = false;
        render();
      } else if (action === "previous-page") {
        state.responsePage = Math.max(1, state.responsePage - 1);
        render();
      } else if (action === "select-page") {
        state.responsePage = Number(element.dataset.page);
        render();
      } else if (action === "next-page") {
        state.responsePage = Math.min(5, state.responsePage + 1);
        render();
      } else if (action === "select-report-chapter") {
        state.reportChapter = Number(element.dataset.reportChapter);
        state.reportEditing = false;
        render();
      } else if (action === "edit-report") {
        state.reportEditing = !state.reportEditing;
        render();
        toast(state.reportEditing ? "已进入报告编辑模式" : "报告修改已保存");
      } else if (action === "add-question") {
        state.questions.push({ title: `问题 ${state.questions.length + 1}`, type: "短文本", required: false, desc: "", placeholder: "请输入……" });
        state.selectedQuestion = state.questions.length - 1;
        markDirty();
        render();
        $("#workspace").scrollTop = $("#workspace").scrollHeight;
        toast("已添加新问题");
      } else if (action === "duplicate-question") {
        const current = state.questions[state.selectedQuestion];
        state.questions.splice(state.selectedQuestion + 1, 0, {...current, options: current.options ? [...current.options] : undefined});
        state.selectedQuestion += 1; markDirty(); renderPreservingScroll(); toast("问题已复制");
      } else if (action === "delete-question") {
        if (state.questions.length === 1) return toast("至少保留一个问题");
        state.questions.splice(state.selectedQuestion, 1);
        state.selectedQuestion = Math.max(0, state.selectedQuestion - 1);
        markDirty(); renderPreservingScroll(); toast("问题已删除");
      } else if (action === "move-up") moveQuestion(-1);
      else if (action === "move-down") moveQuestion(1);
      else if (action === "collapse-ai") { state.aiCollapsed = true; render(); }
      else if (action === "expand-ai") { state.aiCollapsed = false; render(); }
      else if (action === "collapse-side") {
        state.sideCollapsed = !state.sideCollapsed;
        render();
      } else if (action === "ai-send") {
        const input = $("#aiInput");
        toast(input && input.value.trim() ? "AI 正在分析你的要求" : "请输入优化要求");
      } else if (action === "ai-preview") toast("已打开 3 项变更预览");
      else if (action === "ai-apply") { toast("AI 建议已应用"); markDirty(); }
      else if (action === "add-chapter") { state.chapters.push(`新章节 ${state.chapters.length + 1}`); state.chapter = state.chapters.length - 1; render(); toast("已添加报告章节"); }
      else if (action === "template-preview" || action === "open-preview") openPreview();
      else if (action === "auto-layout") toast("报告画布已自动排版");
      else if (action === "copy-link") {
        const value = $("#publishUrl").value;
        if (navigator.clipboard) navigator.clipboard.writeText(value).catch(() => {});
        toast("发布链接已复制");
      } else if (action === "publish") { state.published = !state.published; render(); toast(state.published ? "问卷已发布，开始回收答卷" : "已停止回收"); }
      else if (action === "limit-minus") { state.limit = Math.max(1, state.limit - 10); $("#limitValue").textContent = state.limit; markDirty(); }
      else if (action === "limit-plus") { state.limit += 10; $("#limitValue").textContent = state.limit; markDirty(); }
      else if (action === "toggle") { element.classList.toggle("on"); markDirty(); }
      else if (action === "recheck") toast("发布检查通过，4 项均已就绪");
      else if (action === "next-response") { state.response = (state.response + 1) % state.responses.length; render(); }
      else if (action === "invalid-response") { state.responses[state.response][6] = "无效"; render(); toast("该答卷已设为无效"); }
      else if (action === "export-data") toast("CSV 数据已准备下载");
      else if (action === "regenerate") toast("正在重新生成当前章节");
      else if (action === "export-report") toast("请选择 PDF 或 Word 导出格式");
      else if (action === "full-report") toast("完整报告生成任务已启动");
      else if (action === "rewrite") toast("AI 正在改写当前章节");
    }

    function openPreview() {
      const previewUrl = `${location.href.split("#")[0]}#preview`;
      const previewTab = window.open(previewUrl, "_blank");
      if (previewTab) {
        toast("已在新标签页打开预览");
        return;
      }
      state.step = "design";
      state.previewing = true;
      render();
      history.replaceState(null, "", "#preview");
      toast("浏览器阻止了新标签页，已在当前页打开预览");
    }

    function closePreview() {
      if (!state.previewing) return;
      if (window.opener && !window.opener.closed) {
        window.close();
        return;
      }
      state.previewing = false;
      render();
      history.replaceState(null, "", "#design");
    }

    $$(".step").forEach(step => step.onclick = () => setStep(step.dataset.step));
    $("#previewBtn").onclick = openPreview;
    $("#saveBtn").onclick = () => handleAction("save-changes", $("#saveBtn"));
    $("#backBtn").onclick = () => setDashboard("my");
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      closePreview();
      if (state.createModal) {
        state.createModal = false;
        render();
      }
    });

    const initial = location.hash.slice(1);
    if (["design","template","publish","responses","report"].includes(initial)) state.step = initial;
    if (initial === "preview") {
      state.step = "design";
      state.previewing = true;
    }
    if (["home","my","templates","reportTemplates","insights"].includes(initial)) {
      state.step = "home";
      state.dashboardView = initial;
    }
    render();
  </script>
</body>
</html>
