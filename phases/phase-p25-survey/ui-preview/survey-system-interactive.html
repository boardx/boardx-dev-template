<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BoardX Survey 交互原型</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #6f7378;
      --line: #e4e6e8;
      --line-strong: #d5d8dc;
      --panel: #ffffff;
      --wash: #f7f8f8;
      --soft: #f1f2f3;
      --green: #16a85b;
      --green-soft: #eaf8f0;
      --orange: #e99217;
      --red: #df3b3b;
      --blue: #306acb;
      --purple: #6f4bf2;
      --purple-deep: #5634d8;
      --purple-soft: #eee9ff;
      --purple-wash: #f8f6ff;
      --shadow: 0 1px 2px rgba(0,0,0,.04);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: var(--wash);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; font-size: 14px; letter-spacing: 0; }
    button, input, textarea, select { font: inherit; color: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid rgba(23,23,23,.28);
      outline-offset: 2px;
    }
    .app {
      display: grid;
      grid-template-rows: 76px 108px minmax(0, 1fr);
      height: 100vh;
      min-width: 1120px;
      background: var(--wash);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.98);
    }
    .brand-row, .actions, .inline, .meta-row, .field-row { display: flex; align-items: center; }
    .brand-row { min-width: 0; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 20px; font-weight: 720; }
    .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 8px; background: #111; color: #fff; font-weight: 800; }
    .top-divider { width: 1px; height: 30px; background: var(--line-strong); }
    .survey-name { max-width: 460px; overflow: hidden; font-size: 17px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .workflow-badge { display: inline-flex; min-height: 28px; align-items: center; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px; background: #fafafa; font-size: 13px; font-weight: 650; }
    .saved { display: inline-flex; align-items: center; gap: 7px; color: var(--green); font-weight: 650; white-space: nowrap; }
    .saved-dot { display: grid; width: 17px; height: 17px; place-items: center; border: 1.5px solid currentColor; border-radius: 50%; font-size: 11px; }
    .actions { gap: 10px; }
    .btn {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      color: inherit;
      font-weight: 620;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: border-color .16s, background .16s, color .16s, transform .16s;
    }
    .btn:hover { border-color: #aeb2b7; background: #fafafa; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { border-color: #111; background: #111; color: #fff; }
    .btn.primary:hover { background: #292929; }
    .btn.danger { color: var(--red); }
    .btn.small { min-height: 32px; padding: 0 11px; font-size: 12px; }
    .btn.icon { width: 34px; min-height: 34px; padding: 0; }
    .btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
    .btn.dashed { width: 100%; border-style: dashed; }
    .workflow {
      display: grid;
      grid-template-columns: repeat(5, minmax(150px, 1fr));
      gap: 10px;
      align-items: center;
      padding: 14px 30px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .step {
      position: relative;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-height: 78px;
      padding: 12px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      text-align: left;
    }
    .step-num { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 7px; background: var(--soft); font-weight: 720; }
    .step.active { border-color: var(--purple); background: var(--purple-soft); color: var(--ink); }
    .step.active .step-num { background: #ddd4ff; color: var(--purple-deep); }
    .step.active .step-desc { color: var(--muted); }
    .step-label { display: block; font-weight: 720; }
    .step-desc { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .workspace { display: grid; min-height: 0; grid-template-columns: 56px 286px minmax(540px, 1fr) 318px; }
    .rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-right: 1px solid var(--line);
      background: #fff;
    }
    .rail-pill { display: grid; width: 36px; min-height: 36px; place-items: center; border-radius: 7px; background: var(--soft); font-size: 18px; }
    .rail-count { font-weight: 720; }
    .side, .ai {
      min-height: 0;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #fff;
    }
    .ai { border-right: 0; border-left: 1px solid var(--line); }
    .side-head, .ai-head, .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .side-head { position: sticky; top: 0; z-index: 2; padding: 18px 16px 12px; background: #fff; }
    .side-title { font-size: 16px; font-weight: 760; }
    .outline { display: grid; gap: 8px; padding: 0 12px 18px; }
    .outline-item {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 11px;
      align-items: center;
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #fff;
      text-align: left;
      transition: background .15s, border-color .15s;
    }
    .outline-item:hover { border-color: var(--line); background: var(--wash); }
    .outline-item.active { border-color: #111; background: #111; color: #fff; }
    .outline-num { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 7px; background: var(--soft); font-weight: 720; color: var(--ink); }
    .outline-label { display: block; overflow: hidden; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
    .outline-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .outline-item.active .outline-meta { color: rgba(255,255,255,.7); }
    .main { min-width: 0; min-height: 0; overflow: auto; background: var(--wash); }
    .main-inner { width: min(100%, 980px); margin: 0 auto; padding: 24px 24px 80px; }
    .eyebrow { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border-radius: 6px; background: var(--soft); font-size: 12px; font-weight: 680; }
    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 14px; font-size: 26px; line-height: 1.25; }
    h2 { font-size: 20px; line-height: 1.3; }
    h3 { font-size: 15px; line-height: 1.35; }
    .subcopy { margin-top: 10px; color: var(--muted); line-height: 1.7; }
    .meta-row { flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .chip { display: inline-flex; min-height: 28px; align-items: center; gap: 6px; padding: 0 9px; border-radius: 6px; background: var(--soft); color: #4f5459; font-size: 12px; }
    .chip.green { background: var(--green-soft); color: var(--green); font-weight: 650; }
    .card { border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: var(--shadow); }
    .editor { margin-top: 22px; }
    .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .editor-title { display: flex; align-items: center; gap: 10px; }
    .editor-actions { display: flex; flex-wrap: wrap; gap: 3px; }
    .editor-body { display: grid; gap: 18px; padding: 20px; }
    .field-grid { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 18px; }
    .field { display: grid; gap: 8px; min-width: 0; }
    .field label { color: #565b60; font-size: 12px; font-weight: 620; }
    .required { color: var(--red); }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], textarea, select {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      transition: border-color .16s, box-shadow .16s;
    }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], select { height: 42px; padding: 0 12px; }
    textarea { min-height: 92px; resize: vertical; padding: 12px; line-height: 1.6; }
    input:focus, textarea:focus, select:focus { border-color: #888; box-shadow: 0 0 0 3px rgba(0,0,0,.05); outline: 0; }
    .check { display: inline-flex; align-items: center; gap: 9px; font-weight: 620; }
    .check input { width: 17px; height: 17px; accent-color: #111; }
    .counted { position: relative; }
    .count { position: absolute; right: 11px; bottom: 9px; color: #9a9da1; font-size: 12px; }
    .advanced { width: 100%; padding: 14px 20px; border: 0; border-top: 1px solid var(--line); background: #fff; font-weight: 650; text-align: left; }
    .advanced:hover { background: var(--wash); }
    .settings-reveal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 16px 20px; border-top: 1px solid var(--line); background: #fafafa; }
    .settings-reveal label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .ai-detail-list { display: grid; gap: 8px; margin-top: 12px; padding: 12px; border-radius: 6px; background: var(--wash); color: #555b60; font-size: 12px; line-height: 1.5; }
    .editable { border-radius: 6px; box-shadow: 0 0 0 2px rgba(48,106,203,.24); outline: 0; }
    .add-bottom { display: flex; justify-content: center; padding: 16px 20px; border-top: 1px solid var(--line); }
    .page-foot { margin-top: 26px; color: #8a8d91; text-align: center; }
    .ai { padding: 18px 16px; }
    .ai-head { margin-bottom: 12px; }
    .ai-title { font-size: 16px; font-weight: 760; }
    .ai-copy { margin-bottom: 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .ai-compose { position: relative; }
    .ai-compose textarea { min-height: 102px; padding-right: 44px; }
    .ai-send { position: absolute; right: 9px; bottom: 9px; width: 32px; height: 32px; border: 0; border-radius: 7px; background: #111; color: #fff; font-weight: 800; }
    .ai-status, .ai-result { margin-top: 14px; padding: 16px; }
    .status-line { display: flex; align-items: center; gap: 9px; }
    .spinner { width: 20px; height: 20px; border: 2px solid #cfeeda; border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success-icon { display: grid; width: 20px; height: 20px; place-items: center; border: 1.5px solid var(--green); border-radius: 50%; color: var(--green); font-size: 12px; }
    .ai-result p { margin-top: 12px; color: var(--muted); line-height: 1.6; }
    .ai-result .actions { margin-top: 16px; }
    .ai-collapsed { display: none; }
    .template-layout, .responses-layout, .report-layout { display: grid; min-height: 100%; }
    .template-canvas { margin-top: 18px; padding: 14px; background-image: linear-gradient(#edf0f2 1px, transparent 1px), linear-gradient(90deg,#edf0f2 1px,transparent 1px); background-size: 22px 22px; }
    .source-list { display: grid; gap: 7px; margin-top: 14px; }
    .source-row { display: flex; min-height: 38px; align-items: center; gap: 12px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 16px 0 10px; }
    .module-grid { display: grid; grid-template-columns: 1.25fr .8fr; gap: 12px; }
    .module { min-height: 260px; padding: 15px; }
    .bars { display: flex; height: 150px; align-items: end; justify-content: space-around; gap: 10px; padding: 20px 8px 0; border-bottom: 1px solid var(--line-strong); }
    .bar-group { display: flex; height: 100%; align-items: end; gap: 4px; }
    .bar { width: 16px; border-radius: 2px 2px 0 0; background: var(--blue); }
    .bar.alt { background: #25a866; }
    .donut { display: grid; width: 150px; height: 150px; margin: 20px auto; place-items: center; border-radius: 50%; background: conic-gradient(var(--blue) 0 53%, #25a866 53% 100%); }
    .donut::after { display: grid; width: 76px; height: 76px; place-items: center; border-radius: 50%; background: #fff; content: "118"; font-size: 22px; font-weight: 760; }
    .setting-panel { margin-top: 12px; padding: 16px; }
    .setting-list { display: grid; gap: 16px; margin-top: 16px; }
    .template-main { background: var(--purple-wash); }
    .template-main .main-inner { width: 100%; max-width: none; padding: 20px 22px 64px; }
    .template-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: -20px -22px 18px;
      padding: 13px 22px;
      border-bottom: 1px solid #ddd7f4;
      background: rgba(248,246,255,.96);
      backdrop-filter: blur(10px);
    }
    .template-header-copy { min-width: 0; }
    .template-header-title { display: flex; align-items: center; gap: 9px; font-size: 17px; }
    .template-status { color: var(--muted); font-size: 12px; }
    .btn.purple { border-color: var(--purple); background: var(--purple); color: #fff; }
    .btn.purple:hover { border-color: var(--purple-deep); background: var(--purple-deep); }
    .template-overview {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: start;
      padding: 20px 22px;
      border-top: 4px solid var(--purple);
    }
    .template-overview h1 { margin-top: 0; font-size: 23px; }
    .template-overview p { margin-top: 8px; color: var(--muted); line-height: 1.65; }
    .template-overview-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .template-overview .chip.purple, .chip.purple { background: var(--purple-soft); color: var(--purple-deep); font-weight: 650; }
    .analysis-unit { margin-top: 14px; overflow: hidden; }
    .analysis-unit-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
    }
    .analysis-unit-title { display: flex; align-items: center; gap: 10px; }
    .analysis-index {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 7px;
      background: var(--purple-soft);
      color: var(--purple-deep);
      font-weight: 760;
    }
    .analysis-unit-body { padding: 20px; }
    .analysis-fields { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 14px; }
    .analysis-fields .objective { grid-column: 1 / -1; }
    .question-source-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-top: 18px; }
    .source-group { min-width: 0; padding: 15px; border: 1px solid var(--line); border-radius: 7px; background: #fcfcfd; }
    .source-group-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .source-group-head p { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .question-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .question-chip {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border: 1px solid #ddd7f4;
      border-radius: 6px;
      background: var(--purple-wash);
      color: #433a63;
      font-size: 12px;
    }
    .question-chip b { color: var(--purple-deep); }
    .reuse-note { display: inline-flex; align-items: center; gap: 5px; color: var(--purple-deep); font-size: 11px; }
    .unit-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .unit-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .unit-section-head p { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .output-list { margin-top: 10px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
    .output-row {
      display: grid;
      grid-template-columns: 36px 110px minmax(160px,.8fr) minmax(220px,1.3fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 70px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .output-row:last-child { border-bottom: 0; }
    .output-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 7px; background: var(--purple-soft); color: var(--purple-deep); font-weight: 760; }
    .output-type { color: var(--muted); font-size: 12px; }
    .output-title { font-weight: 680; }
    .output-prompt { overflow: hidden; color: var(--muted); font-size: 12px; line-height: 1.45; text-overflow: ellipsis; white-space: nowrap; }
    .template-prompt textarea { min-height: 108px; background: #fcfcfd; }
    .template-side .outline { gap: 5px; }
    .template-side .outline-item { min-height: 74px; }
    .template-side .outline-item.active { border-color: var(--purple); background: var(--purple-soft); color: var(--ink); }
    .template-side .outline-item.active .outline-meta { color: var(--muted); }
    .template-side .outline-item.active .outline-num { background: var(--purple); color: #fff; }
    .template-ai { padding: 0; background: #fff; }
    .template-ai .template-ai-head { padding: 18px 16px 14px; border-bottom: 1px solid var(--line); }
    .template-ai-body { padding: 14px 16px 24px; }
    .template-ai-message { margin-bottom: 12px; padding: 12px; border-radius: 7px; background: var(--purple-wash); color: #4d4660; font-size: 12px; line-height: 1.6; }
    .ai-prompt-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .proposal { margin-top: 14px; border: 1px solid #d8d0fa; border-radius: 8px; overflow: hidden; }
    .proposal-head { padding: 13px 14px; background: var(--purple-soft); }
    .proposal-list { display: grid; }
    .proposal-item { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 9px; padding: 12px 14px; border-top: 1px solid #e4dff8; background: #fff; }
    .proposal-item input { width: 16px; height: 16px; accent-color: var(--purple); }
    .proposal-item p { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .proposal-actions { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); background: #fafafa; }
    .modal-layer.template-modal { z-index: 20; }
    .template-dialog { width: min(calc(100vw - 40px), 860px); max-height: calc(100vh - 56px); overflow: auto; padding: 0; }
    .template-dialog-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--line); background: #fff; }
    .template-dialog-body { padding: 18px 20px 22px; }
    .picker-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .question-picker-list { display: grid; gap: 8px; }
    .picker-row {
      display: grid;
      grid-template-columns: 22px 46px minmax(0,1fr) 92px 120px;
      gap: 10px;
      align-items: center;
      min-height: 54px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }
    .picker-row input { width: 16px; height: 16px; accent-color: var(--purple); }
    .picker-row .reuse { color: var(--purple-deep); font-size: 11px; text-align: right; }
    .output-picker-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
    .output-choice { min-height: 136px; padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: #fff; text-align: left; }
    .output-choice:hover { border-color: var(--purple); background: var(--purple-wash); }
    .output-choice h3 { margin-top: 10px; }
    .output-choice p { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .diff-column { padding: 14px; border: 1px solid var(--line); border-radius: 7px; }
    .diff-column.after { border-color: #d8d0fa; background: var(--purple-wash); }
    .diff-column ul { margin: 12px 0 0; padding-left: 18px; line-height: 1.8; }
    @media (max-width: 1360px) {
      .workspace { grid-template-columns: 50px 248px minmax(520px, 1fr) 300px; }
      .analysis-fields { grid-template-columns: minmax(0, 1fr) 190px; }
      .output-row { grid-template-columns: 34px 92px minmax(140px,1fr) auto; }
      .output-prompt { display: none; }
    }
    .segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
    .segment { min-height: 40px; border: 0; border-right: 1px solid var(--line); background: #fff; }
    .segment:last-child { border-right: 0; }
    .segment.active { background: #111; color: #fff; }
    .publish-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; margin-top: 20px; }
    .publish-card { padding: 18px; }

    .create-modal { width: min(770px, 94vw); padding: 26px; }
    .create-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .create-modal-head p { margin-top: 7px; color: var(--muted); }
    .creation-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
    .creation-option { display: flex; min-height: 224px; flex-direction: column; align-items: flex-start; padding: 22px; text-align: left; }
    .creation-option.featured { border-color: #cfc4ff; background: #f7f5ff; }
    .creation-option h3 { margin-top: 24px; font-size: 16px; }
    .creation-option p { margin-top: 12px; color: var(--muted); line-height: 1.65; }
    .creation-option .text-link { margin-top: auto; padding-top: 22px; color: #171717; }
    .creation-option.featured .text-link { color: #6748dc; }
    .recommend { margin-left: 7px; padding: 3px 7px; border: 1px solid #cfc4ff; border-radius: 999px; color: #6748dc; font-size: 11px; }
    .modal-icon { display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid var(--line); border-radius: 8px; font-size: 20px; }
    .workspace.design-mode { display: block; overflow: auto; background: #f6f6f6; }
    .design-shell {
      display: grid;
      width: min(calc(100% - 60px), 1610px);
      grid-template-columns: minmax(0, 1096px) minmax(390px, 494px);
      grid-template-areas: "content assistant";
      gap: 20px;
      margin: 0 auto;
      padding: 40px 0 80px;
    }
    .design-content { grid-area: content; display: grid; align-content: start; gap: 14px; min-width: 0; }
    .survey-summary { position: relative; padding: 38px 30px 30px; overflow: hidden; }
    .survey-summary::before { position: absolute; inset: 0 0 auto; height: 7px; background: #6745e8; content: ""; }
    .summary-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 26px; }
    .summary-top h1 { margin: 0; font-size: 25px; }
    .summary-top p { margin-top: 14px; font-size: 15px; }
    .summary-scope { display: flex; align-items: center; gap: 10px; }
    .summary-scope select { width: 200px; }
    .summary-divider { height: 1px; margin: 20px 0; background: var(--line); }
    .summary-meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .chip.purple { background: #eee9ff; color: #6745e8; font-weight: 680; }
    .chip.black { background: #171717; color: #fff; font-weight: 680; }
    .hypothesis-card { padding: 26px; }
    .hypothesis-title { display: flex; align-items: center; gap: 10px; }
    .hypothesis-title > span:first-child { color: #6745e8; font-size: 20px; }
    .hypothesis-rows { margin-top: 18px; }
    .hypothesis-row { display: grid; min-height: 48px; grid-template-columns: 36px 1fr auto; align-items: center; border-top: 1px solid var(--line); }
    .hypothesis-row:first-child { border-top: 0; }
    .question-card { overflow: hidden; border-left: 3px solid #d2c6ff; }
    .question-card .editor-head { padding: 24px 26px; }
    .question-card .editor-body { padding: 24px 26px 28px; }
    .question-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px 220px; gap: 14px; }
    .option-list { display: grid; gap: 0; margin-top: 4px; }
    .option-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 54px; border-bottom: 1px solid var(--line); }
    .option-radio { width: 19px; height: 19px; border: 1px solid var(--line-strong); border-radius: 50%; }
    .option-row input { height: 52px; border: 0; padding: 0; box-shadow: none; }
    .option-row input:focus { box-shadow: none; }
    .option-radio.multiple { border-radius: 4px; }
    .rating-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .rating-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #6745e8;
      font-size: 21px;
    }
    .rating-button:hover { border-color: #b7a7f7; background: #f8f6ff; }
    .nps-row { display: grid; grid-template-columns: repeat(11, minmax(34px, 1fr)); gap: 6px; margin-top: 10px; }
    .nps-row .segment { min-width: 0; padding: 0; }
    .paragraph-preview { min-height: 92px; margin-top: 10px; color: var(--muted); resize: vertical; }
    .question-footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 22px; }
    .question-footer .check { margin: 0; }
    .question-position { color: var(--muted); font-size: 12px; }
    .add-question-bottom { min-height: 54px; border-color: var(--line-strong); background: #fff; font-size: 14px; }
    .add-question-bottom:hover { border-color: #9f91e7; background: #faf9ff; color: #6745e8; }
    .design-ai {
      position: sticky;
      top: 0;
      grid-area: assistant;
      min-height: 850px;
      align-self: start;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
    }
    .design-ai-head { padding: 24px 22px 20px; border-bottom: 1px solid var(--line); }
    .design-ai-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .design-ai-title strong { font-size: 17px; }
    .design-ai-head p { margin-top: 9px; color: var(--muted); line-height: 1.6; }
    .ai-notice, .ai-message { margin-top: 14px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); line-height: 1.55; }
    .ai-message { margin: 22px; color: #333; }
    .design-ai-compose { padding: 20px 22px 22px; border-top: 1px solid var(--line); }
    .design-ai-compose textarea { min-height: 118px; }
    .ai-prompts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .ai-prompts .btn { min-height: 34px; padding: 0 11px; font-size: 12px; }
    .ai-generate { width: 100%; margin-top: 14px; border-color: #eee; background: #f1f1f1; color: #777; }
    @media (max-width: 1280px) {
      .app { min-width: 980px; }
      .workflow { padding: 0 34px; gap: 22px; }
      .workspace { grid-template-columns: 48px 250px minmax(500px,1fr) 286px; }
      .main-inner { padding-right: 18px; padding-left: 18px; }
      .home-shell { grid-template-columns: 300px minmax(0, 1fr); }
      .home-main-inner { padding-right: 36px; padding-left: 36px; }
      .design-shell { width: calc(100% - 36px); grid-template-columns: minmax(0, 1fr) 360px; }
      .question-grid { grid-template-columns: minmax(0, 1fr) 180px; }
      .question-grid .field:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app.home-mode { min-width: 0; height: auto; min-height: 100vh; }
      .app.home-mode .workspace { height: auto; min-height: 100vh; }
      .home-shell { display: block; }
      .global-rail { display: none; }
      .home-sidebar { position: sticky; top: 0; z-index: 10; display: block; padding: 12px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
      .home-brand { padding: 0; }
      .home-sidebar nav { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; }
      .home-nav-group { display: contents; }
      .home-nav-label, .home-ai-note, .home-nav-icon, .home-nav-count { display: none; }
      .home-nav-item { min-width: max-content; min-height: 36px; padding: 0 11px; font-size: 12px; }
      .home-main { overflow: visible; }
      .home-main-inner { padding: 24px 16px 50px; }
      .home-hero { display: grid; }
      .home-hero h1 { font-size: 24px; }
      .home-stats { grid-template-columns: repeat(2, 1fr); padding: 16px; }
      .method-grid, .create-strip, .library-grid, .report-grid, .insight-kpis { grid-template-columns: 1fr; }
      .method-item { padding: 18px 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .template-grid { grid-template-columns: 1fr 1fr; }
      .survey-list-head { display: none; }
      .survey-row { grid-template-columns: 1fr auto; gap: 10px; }
      .survey-row > :nth-child(3) { display: none; }
      .recent-row { grid-template-columns: 1fr auto; }
      .recent-row > :nth-child(2), .recent-row > :nth-child(3) { display: none; }
      .creation-options { grid-template-columns: 1fr; }
      .creation-option { min-height: 190px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-row">
        <span class="workflow-badge">Survey Workflow</span>
        <span class="survey-name">商品反馈问卷</span>
      </div>
      <div class="actions">
        <button class="btn hidden" id="previewBtn" type="button">预览</button>
        <button class="btn primary hidden" id="saveBtn" type="button">保存修改</button>
        <button class="btn" id="backBtn" type="button">‹&nbsp; 返回列表</button>
      </div>
    </header>

    <nav class="workflow" data-testid="survey-workflow" aria-label="问卷工作流">
      <button class="step active" data-testid="step-design" data-step="design" type="button"><span class="step-num">01</span><span><span class="step-label">▣&nbsp; 设计问卷</span><span class="step-desc">题目与元数据</span></span></button>
      <button class="step" data-testid="step-template" data-step="template" type="button"><span class="step-num">02</span><span><span class="step-label">▤&nbsp; 报告模板</span><span class="step-desc">分类与模块组件</span></span></button>
      <button class="step" data-testid="step-publish" data-step="publish" type="button"><span class="step-num">03</span><span><span class="step-label">▽&nbsp; 发布回收</span><span class="step-desc">链接与回收规则</span></span></button>
      <button class="step" data-testid="step-responses" data-step="responses" type="button"><span class="step-num">04</span><span><span class="step-label">◎&nbsp; 查看答题</span><span class="step-desc">答题页与样本</span></span></button>
      <button class="step" data-testid="step-report" data-step="report" type="button"><span class="step-num">05</span><span><span class="step-label">▥&nbsp; 分析报告</span><span class="step-desc">洞察与导出</span></span></button>
    </nav>

    <div class="workspace" id="workspace" data-testid="survey-workspace"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const surveyTitle = "商品反馈问卷";
    const questionTypes = ["短文本", "段落", "邮箱", "数字", "手机号", "单选", "多选", "下拉", "评分", "线性量表", "NPS", "日期", "时间", "文件上传"];
    const state = {
      step: "home",
      dashboardView: "home",
      createModal: false,
      templateFilter: "全部",
      selectedQuestion: 0,
      previewing: false,
      previewAnswers: {},
      aiCollapsed: false,
      sideCollapsed: true,
      saveTimer: null,
      published: false,
      limit: 200,
      chapter: 0,
      module: "chart",
      response: 0,
      responsePage: 1,
      responseView: 0,
      customResponseViews: [],
      responseDetailOpen: true,
      responseQuery: "",
      publishSection: 0,
      reportChapter: 1,
      reportEditing: false,
      advancedOpen: false,
      chapterSettingsOpen: false,
      templateSourcesOpen: true,
      aiDetailsOpen: false,
      templateSaved: true,
      questionPickerOpen: false,
      questionPickerRole: "core",
      outputPickerOpen: false,
      templateDiffOpen: false,
      templatePreviewOpen: false,
      aiProposalOpen: false,
      proposalChecks: [true, true, true],
      questions: [
        { title: "您之前是否使用过同类商品？", type: "单选", required: true, desc: "行为习惯", options: ["经常使用", "偶尔使用", "第一次使用"] },
        { title: "您购买或试用这款新品的主要原因是什么？", type: "多选", required: true, desc: "偏好", options: ["功能吸引", "价格合适", "朋友推荐", "品牌信任"] },
        { title: "您对新品外观和包装的满意度是多少？", type: "评分", required: true, desc: "满意度" },
        { title: "您对新品价格的接受程度如何？", type: "单选", required: true, desc: "价格感知", options: ["非常合理", "基本合理", "偏贵", "无法接受"] },
        { title: "您对新品整体体验的评分是多少？", type: "评分", required: true, desc: "满意度" },
        { title: "您愿意再次购买的可能性是多少？", type: "NPS", required: true, desc: "偏好" },
        { title: "还有哪些建议希望告诉我们？", type: "段落", required: false, desc: "开放反馈" }
      ],
      chapters: [
        {
          title: "购买驱动与用户分层",
          objective: "识别不同使用经验用户的购买动机差异，明确新品首购与复购的关键驱动因素。",
          method: "交叉分析",
          core: [1, 5],
          dimensions: [0],
          outputs: [
            { type: "管理层结论", icon: "T", title: "关键购买驱动结论", prompt: "先给出结论，再说明不同使用经验人群的主要购买驱动差异，并标注样本限制。" },
            { type: "堆叠条形图", icon: "▥", title: "购买原因 × 使用经验", prompt: "以 Q1 为分组维度，展示 Q2 各选项占比；按组内百分比归一化，并标注样本量。" },
            { type: "行动建议", icon: "→", title: "分层转化建议", prompt: "针对首次使用、偶尔使用和经常使用三类人群，分别给出可执行的产品与沟通建议。" }
          ],
          generationPrompt: "以咨询项目经理口吻输出本章。先回答“谁因为什么购买”，再解释人群差异及其业务含义。所有判断必须引用 Q1、Q2、Q6 的数据；样本不足时明确提示，不做因果推断。"
        },
        {
          title: "产品体验与满意度诊断",
          objective: "定位包装、整体体验与价格感知对满意度的影响，形成体验改进优先级。",
          method: "驱动因素分析",
          core: [2, 4],
          dimensions: [3],
          outputs: [
            { type: "指标卡", icon: "#", title: "核心体验指标", prompt: "展示包装满意度与整体体验评分的均值、分布和高低分占比。" },
            { type: "矩阵图", icon: "⊞", title: "体验改进优先级", prompt: "按影响程度和当前表现构建二维优先级矩阵。" }
          ],
          generationPrompt: "围绕体验短板、影响程度和优先级组织章节，区分事实、解释和建议。"
        },
        {
          title: "价格接受度与价值感知",
          objective: "评估价格接受区间及其与体验评价、购买意愿之间的关系。",
          method: "分层对比",
          core: [3, 5],
          dimensions: [0, 4],
          outputs: [
            { type: "分组条形图", icon: "▤", title: "价格接受度分布", prompt: "展示不同使用经验和体验评分人群的价格接受度分布。" },
            { type: "管理层结论", icon: "T", title: "价值感知判断", prompt: "总结价格阻力集中在哪些人群，并给出定价沟通建议。" }
          ],
          generationPrompt: "避免将相关性表述为因果，结合价格接受度、体验评分与复购倾向形成判断。"
        },
        {
          title: "开放反馈与机会主题",
          objective: "从开放反馈中提炼高频主题、典型证据和未满足需求。",
          method: "主题编码",
          core: [6],
          dimensions: [0, 4],
          outputs: [
            { type: "主题表", icon: "▦", title: "反馈主题与证据", prompt: "按主题、频次、代表性原话和涉及人群输出证据表。" },
            { type: "机会清单", icon: "→", title: "产品机会清单", prompt: "将主题转化为机会点，并按影响与可执行性排序。" }
          ],
          generationPrompt: "保留用户原意，引用内容需匿名；低频但高风险主题单独提示。"
        }
      ],
      responses: [
        ["R-0120", "张三（家长）", "2025-05-24 10:15", "5分32秒", "100%", "优秀", "正常"],
        ["R-0119", "匿名答卷", "2025-05-24 09:58", "1分12秒", "45%", "可疑", "需复核"],
        ["R-0118", "李四（家长）", "2025-05-24 09:37", "7分48秒", "100%", "优秀", "正常"],
        ["R-0117", "匿名答卷", "2025-05-24 09:12", "0分28秒", "30%", "差", "无效"],
        ["R-0116", "王五（家长）", "2025-05-24 08:44", "6分05秒", "100%", "良好", "正常"],
        ["R-0115", "匿名答卷", "2025-05-24 08:28", "2分10秒", "70%", "可疑", "需复核"]
      ]
    };

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));

    function toast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove("show"), 1900);
    }

    function markDirty() {
      const saveText = $("#saveText");
      if (saveText) saveText.textContent = "保存中…";
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(() => {
        const currentSaveText = $("#saveText");
        if (currentSaveText) currentSaveText.textContent = "已保存";
      }, 650);
    }

      return `<aside class="global-rail" aria-label="BoardX 主导航">
        <img class="global-logo" src="../../../apps/web/public/logo-icon.png" alt="BoardX Logo">

        <button class="global-link" data-action="global-rooms" type="button"><b>♙</b><span>Rooms</span></button>

      </aside>`;
    }

    function dashboardHome() {
      const templates = [
        ["商品安全", "商品安全市场调研", "8 题 · 4 min"],
        ["满意度", "商品反馈问卷", "7 题 · 3 min"],
        ["用户信息", "用户信息收集", "6 题 · 3 min"],
        ["市场需求", "市场需求调研", "7 题 · 5 min"]

    function questionCard(question, index, categories) {
      const questionIndex = `data-question-index="${index}"`;
      let answerEditor;
      if (question.options) {
        const multiple = question.type === "多选";
        answerEditor = `<div class="field"><label>选项</label><div class="option-list">${question.options.map((option, optionIndex)=>`<label class="option-row"><span class="option-radio ${multiple ? "multiple" : ""}"></span><input data-question-option="${index}" data-option-index="${optionIndex}" type="text" value="${esc(option)}" aria-label="问题 ${index + 1} 选项 ${optionIndex + 1}"></label>`).join("")}</div><button class="btn ghost" data-action="add-option" ${questionIndex} type="button">＋ 添加选项</button></div>`;
      } else if (question.type === "评分") {
        answerEditor = `<div class="field"><label>评分预览</label><div class="rating-row" role="group" aria-label="问题 ${index + 1} 评分">${Array.from({length:5},(_,value)=>`<button class="rating-button" data-action="rating-preview" ${questionIndex} data-rating="${value + 1}" type="button" aria-label="${value + 1} 星">★</button>`).join("")}</div></div>`;
      } else if (question.type === "NPS") {
        answerEditor = `<div class="field"><label>NPS 评分预览</label><div class="nps-row" role="group" aria-label="问题 ${index + 1} NPS 评分">${Array.from({length:11},(_,value)=>`<button class="segment" data-action="nps-preview" ${questionIndex} data-rating="${value}" type="button">${value}</button>`).join("")}</div></div>`;
      } else if (question.type === "段落") {
        answerEditor = `<div class="field"><label>回答区域</label><textarea class="paragraph-preview" data-question-paragraph="${index}" placeholder="受访者可在此填写详细建议"></textarea></div>`;
      } else {
        answerEditor = `<div class="field"><label>回答预览</label><input data-question-placeholder="${index}" type="text" value="${esc(question.placeholder || "")}" placeholder="请输入回答占位提示"></div>`;
      }

      return `<section class="question-card card" aria-label="问题 ${index + 1}" data-question-card="${index}">
        <div class="editor-head"><div class="editor-title"><strong>Q${index + 1}</strong><span class="chip">${esc(question.type)}</span><span class="chip purple">${esc(question.desc || "未分类")}</span></div><div class="editor-actions"><button class="btn small ghost" data-action="duplicate-question" ${questionIndex} type="button">复制</button><button class="btn small ghost" data-action="move-up" ${questionIndex} type="button" ${index === 0 ? "disabled" : ""}>↑ 上移</button><button class="btn small ghost" data-action="move-down" ${questionIndex} type="button" ${index === state.questions.length - 1 ? "disabled" : ""}>↓ 下移</button><button class="btn small ghost danger" data-action="delete-question" ${questionIndex} type="button">删除</button></div></div>
        <div class="editor-body">
          <div class="question-grid"><div class="field counted"><label>题目标题 <span class="required">*</span></label><input data-question-title="${index}" type="text" maxlength="200" value="${esc(question.title)}"><span class="count">${question.title.length}/200</span></div><div class="field"><label>题目类型</label><select data-question-type="${index}">${questionTypes.map(type => `<option ${type === question.type ? "selected" : ""}>${type}</option>`).join("")}</select></div><div class="field"><label>题目分类</label><select data-question-category="${index}">${categories.map(category=>`<option ${category===question.desc?"selected":""}>${category}</option>`).join("")}</select></div></div>
          ${answerEditor}
          <div class="question-footer"><label class="check"><input data-question-required="${index}" type="checkbox" ${question.required ? "checked" : ""}> 核心问题设为必填</label><span class="question-position">第 ${index + 1} 题，共 ${state.questions.length} 题</span></div>
        </div>
      </section>`;
    }

    function designAiPanel() {
      if (state.aiCollapsed) return `<aside class="design-ai" style="padding:14px"><button class="btn icon ghost" data-action="expand-ai" type="button" aria-label="展开 AI 助手">«</button></aside>`;
      return `<aside class="design-ai">
        <div class="design-ai-head"><div class="design-ai-title"><span><strong>AI 助手</strong> <span class="chip">默认开启</span></span><button class="btn icon ghost" data-action="collapse-ai" type="button" aria-label="收起 AI 助手">✧</button></div><p>用自然语言生成待确认变更，逐项应用到左侧问卷。</p><div class="ai-notice">AI 先生成可确认的建议，不会直接覆盖左侧问卷。</div></div>
        <div class="ai-message">右侧可以像聊天一样描述目标、受访者和修改要求；我会生成建议，你确认后同步到左侧问卷。</div>
        <div class="design-ai-compose"><textarea id="aiInput" placeholder="例如：控制在 8 题内；加入 NPS；把语气改得更清楚"></textarea><div class="ai-prompts"><button class="btn" data-action="ai-prompt" data-prompt="加入 NPS" type="button">加入 NPS</button><button class="btn" data-action="ai-prompt" data-prompt="控制在 8 题内" type="button">控制在 8 题内</button><button class="btn" data-action="ai-prompt" data-prompt="核心问题设为必填" type="button">核心问题设为必填</button><button class="btn" data-action="ai-prompt" data-prompt="做发布前检查" type="button">做发布前检查</button></div><button class="btn ai-generate" data-action="ai-send" type="button">▽ 生成待应用变更</button></div>
      </aside>`;
    }

    function designWorkspace() {
      return `<div class="design-shell">${designMain()}${designAiPanel()}</div>`;
    }

    function previewAnsweredCount() {
      return state.questions.reduce((count, _question, index) => {
        const answer = state.previewAnswers[index];
        const answered = Array.isArray(answer) ? answer.length > 0 : answer !== undefined && String(answer).trim() !== "";
        return count + (answered ? 1 : 0);
      }, 0);
    }

    function previewAnswerControl(question, index) {
      const answer = state.previewAnswers[index];
      if (question.options && ["单选", "多选"].includes(question.type)) {
        const multiple = question.type === "多选";
        return `<div class="answer-options">${question.options.map((option, optionIndex) => {
          const checked = multiple ? Array.isArray(answer) && answer.includes(option) : answer === option;
          return `<label class="answer-option"><input data-preview-input data-preview-question="${index}" type="${multiple ? "checkbox" : "radio"}" name="preview-question-${index}" value="${esc(option)}" ${checked ? "checked" : ""}><span>${esc(option || `选项 ${optionIndex + 1}`)}</span></label>`;
        }).join("")}</div>`;
      }
      if (question.type === "评分") {
        return `<div class="answer-scale rating" role="group" aria-label="问题 ${index + 1} 评分">${Array.from({length:5}, (_, value) => `<button class="${Number(answer) === value + 1 ? "selected" : ""}" data-action="preview-rating" data-preview-question="${index}" data-preview-value="${value + 1}" type="button" aria-label="${value + 1} 星">★</button>`).join("")}</div>`;
      }
      if (question.type === "NPS") {
        return `<div class="answer-scale" role="group" aria-label="问题 ${index + 1} NPS 评分">${Array.from({length:11}, (_, value) => `<button class="${Number(answer) === value ? "selected" : ""}" data-action="preview-nps" data-preview-question="${index}" data-preview-value="${value}" type="button">${value}</button>`).join("")}</div>`;
      }
      if (question.type === "段落") {
        return `<textarea class="answer-paragraph" data-preview-input data-preview-question="${index}" placeholder="段落回答">${esc(answer || "")}</textarea>`;
      }
      return `<input class="answer-text" data-preview-input data-preview-question="${index}" type="text" value="${esc(answer || "")}" placeholder="短文本回答">`;
    }

    function previewWorkspace() {
      const answered = previewAnsweredCount();
      return `<div class="preview-shell">
        <div class="preview-paper-wrap">
          <section class="preview-paper" aria-label="问卷答题预览">
            <div class="preview-banner"><img src="../../../apps/web/public/survey/fluent-research-header.webp" alt=""><div class="preview-banner-content"><div class="preview-brand"><span class="preview-brand-icon">☷</span><span>BoardX 调查</span></div><span class="preview-label">问卷预览</span></div></div>
            <form class="preview-form" onsubmit="return false">
              <div class="preview-progress-head"><strong>问卷进度</strong><span id="previewProgressText">${answered} / ${state.questions.length}</span></div>
              <progress class="survey-progress" id="previewProgress" aria-label="问卷预览进度" value="${answered}" max="${Math.max(state.questions.length, 1)}"></progress>
              <header class="preview-intro"><h1>${surveyTitle}</h1><p>用于了解用户对新品包装、价格、整体体验和复购意愿的反馈。</p></header>
              <div class="preview-question-list">${state.questions.map((question, index) => `<section class="answer-question" aria-label="预览问题 ${index + 1}"><div class="answer-question-title"><span>${index + 1}. ${esc(question.title)}</span>${question.required ? `<span class="required">＊</span>` : ""}<span class="answer-question-type">（${esc(question.type)}）</span></div>${previewAnswerControl(question, index)}</section>`).join("")}</div>
              <div class="preview-submit"><button class="btn primary" data-action="submit-preview" type="button">提交答卷</button></div>
            </form>
          </section>
        </div>
      </div>`;
    }

    function chapterSide() {
      return `<aside class="side template-side"><div class="side-head"><span class="side-title">报告章节</span><button class="btn small" data-action="add-chapter" type="button">＋ 添加</button></div><div class="outline">${state.chapters.map((chapter, i) => `<button class="outline-item ${i === state.chapter ? "active" : ""}" data-chapter="${i}" type="button"><span class="outline-num">${String(i + 1).padStart(2,"0")}</span><span><span class="outline-label">${esc(chapter.title)}</span><span class="outline-meta">${esc(chapter.method)} · ${chapter.core.length} 核心题 · ${chapter.outputs.length} 输出</span></span></button>`).join("")}<button class="btn dashed" data-action="add-chapter" type="button">＋ 添加分析章节</button></div></aside>`;
    }

    function questionChip(questionIndex) {
      const question = state.questions[questionIndex];
      return `<span class="question-chip"><b>Q${questionIndex + 1}</b><span>${esc(question.title)}</span></span>`;
    }

    function templateMain() {
      const chapter = state.chapters[state.chapter];
      return `<main class="main template-main"><div class="main-inner">
        <header class="template-header"><div class="template-header-copy"><div class="template-header-title"><strong>报告模板 · ${surveyTitle}</strong><span class="template-status">${state.templateSaved ? "已保存" : "有未保存修改"}</span></div></div><div class="actions"><button class="btn" data-action="template-preview" type="button">预览报告结构</button><button class="btn primary" data-action="save-template" type="button">保存模板</button></div></header>
        <section class="template-overview card"><div><h1>商品反馈诊断报告</h1><p>为咨询顾问与咨询公司领导设计。章节可自由组合题目与分析维度，同一题目可在多个章节重复使用。</p><div class="template-overview-meta"><span class="chip purple">管理层导向</span><span class="chip purple">多维交叉分析</span><span class="chip">${state.chapters.length} 个章节</span><span class="chip">${state.chapters.reduce((sum,item)=>sum+item.outputs.length,0)} 个输出组件</span></div></div><button class="btn" data-action="professional-framework" type="button">使用专业报告框架</button></section>
        <section class="analysis-unit card">
          <div class="analysis-unit-head"><div class="analysis-unit-title"><span class="analysis-index">${String(state.chapter + 1).padStart(2,"0")}</span><div><h2>章节分析单元</h2><span class="outline-meta">目标、证据、分析方法与输出在一个单元内配置</span></div></div><div class="actions"><button class="btn small" data-action="duplicate-chapter" type="button">复制章节</button><button class="btn small danger" data-action="delete-chapter" type="button">删除</button></div></div>
          <div class="analysis-unit-body">
            <div class="analysis-fields"><div class="field"><label>章节标题</label><input data-template-title type="text" value="${esc(chapter.title)}"></div><div class="field"><label>分析方法</label><select data-template-method>${["交叉分析","驱动因素分析","分层对比","趋势分析","主题编码","描述性统计"].map(method=>`<option ${method===chapter.method?"selected":""}>${method}</option>`).join("")}</select></div><div class="field objective"><label>分析目标</label><textarea data-template-objective>${esc(chapter.objective)}</textarea></div></div>
            <div class="question-source-grid">
              <section class="source-group"><div class="source-group-head"><div><h3>核心问题</h3><p>直接回答本章关键业务问题，可选择一道或多道。</p></div><button class="btn small" data-action="open-question-picker" data-question-role="core" type="button">＋ 选择题目</button></div><div class="question-chips">${chapter.core.map(questionChip).join("")}</div></section>
              <section class="source-group"><div class="source-group-head"><div><h3>分组与解释维度</h3><p>用于人群切片、交叉对比或解释结果。</p></div><button class="btn small" data-action="open-question-picker" data-question-role="dimensions" type="button">＋ 选择维度</button></div><div class="question-chips">${chapter.dimensions.map(questionChip).join("")}</div></section>
            </div>
            <div class="reuse-note" style="margin-top:10px">同一道题可在不同章节中重复使用，系统会保留每处独立的分析提示。</div>
            <section class="unit-section"><div class="unit-section-head"><div><h3>章节输出</h3><p>组合文本、图表与表格，分别定义生成目的和提示。</p></div><button class="btn small purple" data-action="open-output-picker" type="button">＋ 添加输出</button></div><div class="output-list">${chapter.outputs.map((output,index)=>`<div class="output-row"><span class="output-icon">${output.icon}</span><div><span class="output-type">${esc(output.type)}</span><div class="output-title">${esc(output.title)}</div></div><div class="output-prompt">${esc(output.prompt)}</div><button class="btn icon small ghost" data-action="edit-output" data-output-index="${index}" type="button" aria-label="编辑输出">⋯</button></div>`).join("")}</div></section>
            <section class="unit-section template-prompt"><div class="unit-section-head"><div><h3>本章生成提示</h3><p>控制分析口径、表达顺序与证据边界，生成报告时按本章执行。</p></div><button class="btn small" data-action="improve-prompt" type="button">AI 优化提示</button></div><div class="field" style="margin-top:10px"><textarea data-template-prompt>${esc(chapter.generationPrompt)}</textarea></div></section>
          </div>
        </section>
      </div></main>`;
    }

    function templateOverlay() {
      const chapter = state.chapters[state.chapter];
      if (state.questionPickerOpen) {
        const current = chapter[state.questionPickerRole];
        return `<div class="modal-layer template-modal"><section class="template-dialog card" role="dialog" aria-modal="true"><header class="template-dialog-head"><div><h2>选择${state.questionPickerRole === "core" ? "核心问题" : "分组与解释维度"}</h2><p class="subcopy" style="margin-top:4px">题目可以被多个章节重复使用，不会从其他章节移除。</p></div><button class="btn icon ghost" data-action="close-template-modal" type="button" aria-label="关闭">×</button></header><div class="template-dialog-body"><div class="question-picker-list">${state.questions.map((question,index)=>{const uses=state.chapters.filter(item=>item.core.includes(index)||item.dimensions.includes(index)).length;return `<label class="picker-row"><input data-picker-question="${index}" type="checkbox" ${current.includes(index)?"checked":""}><strong>Q${index+1}</strong><span>${esc(question.title)}</span><span class="chip">${esc(question.type)}</span><span class="reuse">${uses ? `已用于 ${uses} 个章节` : "尚未使用"}</span></label>`}).join("")}</div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-action="close-template-modal" type="button">取消</button><button class="btn purple" data-action="confirm-question-picker" type="button">确认选择</button></div></div></section></div>`;
      }
      if (state.outputPickerOpen) {
        const choices = [
          ["T","管理层结论","先结论后证据，适合章节开头。"],
          ["#","指标卡","展示核心指标、变化或目标差距。"],
          ["▥","堆叠条形图","适合类别题按人群维度做占比对比。"],
          ["▦","交叉分析表","适合查看两个分类变量的完整分布。"],
          ["⊞","优先级矩阵","按影响程度与当前表现确定优先级。"],
          ["→","行动建议","将洞察转换为责任清晰的行动项。"]
        ];
        return `<div class="modal-layer template-modal"><section class="template-dialog card" role="dialog" aria-modal="true"><header class="template-dialog-head"><div><h2>添加章节输出</h2><p class="subcopy" style="margin-top:4px">系统会根据当前题型与维度生成适用提示，仍可在章节内继续修改。</p></div><button class="btn icon ghost" data-action="close-template-modal" type="button" aria-label="关闭">×</button></header><div class="template-dialog-body"><div class="output-picker-grid">${choices.map((choice,index)=>`<button class="output-choice" data-action="choose-output" data-output-choice="${index}" type="button"><span class="output-icon">${choice[0]}</span><h3>${choice[1]}</h3><p>${choice[2]}</p><span class="reuse-note" style="margin-top:9px">与当前题目兼容</span></button>`).join("")}</div></div></section></div>`;
      }
      if (state.templateDiffOpen) {
        return `<div class="modal-layer template-modal"><section class="template-dialog card" role="dialog" aria-modal="true"><header class="template-dialog-head"><div><span class="eyebrow">AI 变更预览</span><h2 style="margin-top:8px">不同用户群的购买驱动差异</h2></div><button class="btn icon ghost" data-action="close-template-modal" type="button" aria-label="关闭">×</button></header><div class="template-dialog-body"><div class="diff-grid"><section class="diff-column"><strong>当前模板</strong><ul><li>购买动机只在综合章节中呈现</li><li>Q1 与 Q2 未做交叉分析</li><li>输出以总体占比为主</li></ul></section><section class="diff-column after"><strong>应用后</strong><ul><li>新增独立的用户分层章节</li><li>复用 Q1、Q2、Q6 形成证据链</li><li>增加堆叠条形图和管理层结论</li></ul></section></div><section class="card" style="margin-top:12px;padding:14px"><h3>生成提示</h3><p class="subcopy">以 Q1 为分组维度，对比 Q2 各购买原因和 Q6 复购意愿；先呈现结论，再解释差异和业务意义，并标注每组样本量。</p></section><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-action="close-template-modal" type="button">返回修改</button><button class="btn purple" data-action="apply-from-diff" type="button">应用已选变更</button></div></div></section></div>`;
      }
      if (state.templatePreviewOpen) {
        return `<div class="modal-layer template-modal"><section class="template-dialog card" role="dialog" aria-modal="true"><header class="template-dialog-head"><div><span class="eyebrow">报告结构预览</span><h2 style="margin-top:8px">商品反馈诊断报告</h2></div><button class="btn icon ghost" data-action="close-template-modal" type="button" aria-label="关闭">×</button></header><div class="template-dialog-body"><p class="subcopy" style="margin-top:0">报告将按照以下章节顺序生成。每章独立检索题目证据，并执行已配置的分析与输出提示。</p><div class="outline" style="padding:14px 0 0">${state.chapters.map((item,index)=>`<section class="picker-row" style="grid-template-columns:46px minmax(0,1fr) 110px 100px"><strong>${String(index+1).padStart(2,"0")}</strong><span><strong>${esc(item.title)}</strong><span class="outline-meta">${esc(item.objective)}</span></span><span class="chip">${esc(item.method)}</span><span class="reuse">${item.outputs.length} 个输出</span></section>`).join("")}</div></div></section></div>`;
      }
      return "";
    }

    function publishSide() {
      return `<aside class="side"><div class="side-head"><span class="side-title">发布设置</span><button class="btn icon ghost" data-action="collapse-side" type="button" aria-label="收起发布设置">«</button></div><div class="outline"><section class="card" style="padding:14px"><span style="color:var(--muted);font-size:12px">发布检查</span><div class="section-head" style="margin-top:7px"><strong style="font-size:22px">4 / 4</strong><span class="success-icon">✓</span></div><span style="font-size:12px">已就绪</span></section>${["发布状态","回收范围","回收规则","完成页面"].map((x,i)=>`<button class="outline-item ${i === state.publishSection ? "active" : ""}" data-action="publish-section" data-publish-section="${i}" type="button"><span class="outline-num">✓</span><span><span class="outline-label">${x}</span><span class="outline-meta">${i === 0 ? (state.published ? "回收中" : "未发布") : "已配置"}</span></span></button>`).join("")}</div></aside>`;
    }

    function publishMain() {
      return `<main class="main"><div class="main-inner">

    function render() {
      const app = $(".app");
      const workspace = $("#workspace");
      const home = state.step === "home";
      const designMode = state.step === "design" && !state.previewing;
      app.classList.toggle("home-mode", home);
      app.classList.toggle("preview-only", state.step === "design" && state.previewing);
      $("#previewBtn").classList.toggle("hidden", !designMode);
      $("#saveBtn").classList.toggle("hidden", !designMode);
      if (home) {
        workspace.classList.remove("design-mode");
        workspace.classList.remove("preview-mode");
        workspace.innerHTML = homeScreen();
        workspace.style.gridTemplateColumns = "";
        bind();
        $(".home-main").scrollTop = 0;
        return;
      }
      $$(".step").forEach(step => step.classList.toggle("active", step.dataset.step === state.step));
      if (state.step === "design") {
        workspace.classList.toggle("design-mode", !state.previewing);
        workspace.classList.toggle("preview-mode", state.previewing);
        workspace.innerHTML = state.previewing ? previewWorkspace() : designWorkspace();
        workspace.style.gridTemplateColumns = "";
        bind();
        workspace.scrollTop = 0;
        return;
      }
      workspace.classList.remove("design-mode");
      workspace.classList.remove("preview-mode");
      const pieces = {
        template: [chapterSide(), templateMain(), aiPanel("template")],
        publish: [publishSide(), publishMain(), aiPanel("publish")],
        responses: [responseSide(), responsesMain(), aiPanel("responses")],
        report: [reportSide(), reportMain(), aiPanel("report")]
      }[state.step];
      workspace.innerHTML = rail() + (state.sideCollapsed ? "" : pieces[0]) + pieces[1] + pieces[2] + (state.step === "template" ? templateOverlay() : "");
      workspace.style.gridTemplateColumns = state.sideCollapsed ? "56px minmax(540px,1fr) 318px" : "";
      bind();
      $(".main").scrollTop = 0;
    }

    function setStep(step) {
      state.step = step;
      state.previewing = false;
      render();
      history.replaceState(null, "", `#${step}`);
    }

    function setDashboard(view) {
      state.step = "home";
      state.dashboardView = view;
      state.createModal = false;
      render();
      history.replaceState(null, "", `#${view === "home" ? "home" : view}`);
    }

    function moveQuestion(direction) {
      const current = state.selectedQuestion;
      const target = current + direction;
      if (target < 0 || target >= state.questions.length) return;
      [state.questions[current], state.questions[target]] = [state.questions[target], state.questions[current]];
      state.selectedQuestion = target;
      markDirty();
      renderPreservingScroll();
    }

    function bind() {
      $$("[data-question]").forEach(el => el.onclick = () => { state.selectedQuestion = Number(el.dataset.question); render(); });
      $$("[data-chapter]").forEach(el => el.onclick = () => { state.chapter = Number(el.dataset.chapter); render(); });
      $$("[data-response]").forEach(el => el.onclick = () => { state.response = Number(el.dataset.response); state.responseDetailOpen = true; render(); });
      $$("[data-module]").forEach(el => el.onclick = () => { state.module = el.dataset.module; toast(`已切换为${el.textContent}模块`); render(); });
      $$("[data-proposal-check]").forEach(el => el.onchange = () => {
        state.proposalChecks[Number(el.dataset.proposalCheck)] = el.checked;
        renderPreservingScroll();
      });
      $$("[data-template-title]").forEach(el => el.oninput = event => {
        state.chapters[state.chapter].title = event.target.value;
        state.templateSaved = false;
      });
      $$("[data-template-objective]").forEach(el => el.oninput = event => {
        state.chapters[state.chapter].objective = event.target.value;
        state.templateSaved = false;
      });
      $$("[data-template-method]").forEach(el => el.onchange = event => {
        state.chapters[state.chapter].method = event.target.value;
        state.templateSaved = false;
        renderPreservingScroll();
      });
      $$("[data-template-prompt]").forEach(el => el.oninput = event => {
        state.chapters[state.chapter].generationPrompt = event.target.value;
        state.templateSaved = false;
      });
      $$("[data-segment-group] .segment").forEach(el => el.onclick = () => { $$(".segment", el.parentElement).forEach(x => x.classList.remove("active")); el.classList.add("active"); markDirty(); });
      $$("[data-action]").forEach(el => el.addEventListener("click", () => handleAction(el.dataset.action, el)));
      $$("[data-preview-input]").forEach(element => {
        const eventName = element.tagName === "TEXTAREA" || element.type === "text" ? "input" : "change";
        element.addEventListener(eventName, () => {
          const questionIndex = Number(element.dataset.previewQuestion);
          if (element.type === "checkbox") {
            state.previewAnswers[questionIndex] = $$(`[data-preview-input][data-preview-question="${questionIndex}"]:checked`).map(input => input.value);
          } else {
            state.previewAnswers[questionIndex] = element.value;
          }
          updatePreviewProgress();
        });
      });

      $$("[data-question-title]").forEach(element => {
        element.oninput = (event) => {
          const question = state.questions[Number(element.dataset.questionTitle)];
          question.title = event.target.value;
          $(".count", event.target.parentElement).textContent = `${question.title.length}/200`;
          markDirty();
        };
      });
      $$("[data-question-option]").forEach(element => {
        element.oninput = (event) => {
          const question = state.questions[Number(element.dataset.questionOption)];
          question.options[Number(element.dataset.optionIndex)] = event.target.value;
          markDirty();
        };
      });
      $$("[data-question-placeholder]").forEach(element => {
        element.oninput = (event) => {
          state.questions[Number(element.dataset.questionPlaceholder)].placeholder = event.target.value;
          markDirty();
        };
      });
      $$("[data-question-type]").forEach(element => {
        element.onchange = (event) => {
          const question = state.questions[Number(element.dataset.questionType)];
          question.type = event.target.value;
          if (["单选", "多选", "下拉"].includes(question.type) && !question.options) question.options = ["选项 1", "选项 2"];
          if (!["单选", "多选", "下拉"].includes(question.type)) delete question.options;
          markDirty();
          renderPreservingScroll();
        };
      });
      $$("[data-question-category]").forEach(element => {
        element.onchange = (event) => {
          state.questions[Number(element.dataset.questionCategory)].desc = event.target.value;
          markDirty();
          renderPreservingScroll();
        };
      });
      $$("[data-question-required]").forEach(element => {
        element.onchange = (event) => {
          state.questions[Number(element.dataset.questionRequired)].required = event.target.checked;
          markDirty();
        };
      });

      const q = state.questions[state.selectedQuestion];
      const desc = $("#questionDesc");
      if (desc) desc.oninput = (event) => { q.desc = event.target.value; $(".count", event.target.parentElement).textContent = `${q.desc.length}/500`; markDirty(); };
      const placeholder = $("#questionPlaceholder");
      if (placeholder) placeholder.oninput = (event) => { q.placeholder = event.target.value; $(".count", event.target.parentElement).textContent = `${q.placeholder.length}/50`; markDirty(); };
      const responseSearch = $("#responseSearch");
      if (responseSearch) responseSearch.onkeydown = (event) => {
        if (event.key === "Enter") {
          state.responseQuery = event.target.value.trim();
          render();
        }
      };
      const responseStatus = $("#responseStatus");
      if (responseStatus) responseStatus.onchange = (event) => {
        state.responseView = event.target.value === "需复核" ? 2 : event.target.value === "无效" ? 4 : 0;
        render();
      };
    }

    function renderPreservingScroll() {
      const workspace = $("#workspace");
      const scrollTop = workspace.scrollTop;
      render();
      workspace.scrollTop = scrollTop;
    }

    function updatePreviewProgress() {
      const answered = previewAnsweredCount();
      const progress = $("#previewProgress");
      const text = $("#previewProgressText");
      if (progress) progress.value = answered;
      if (text) text.textContent = `${answered} / ${state.questions.length}`;
    }

    function applyTemplateProposal() {
      const checks = state.proposalChecks;
      let target = state.chapters.findIndex(chapter => chapter.title === "不同用户群的购买驱动差异");
      if (checks[0] && target === -1) {
        state.chapters.splice(1, 0, {
          title: "不同用户群的购买驱动差异",
          objective: "比较首次、偶尔和经常使用者的购买驱动与复购倾向，为分层沟通和产品策略提供依据。",
          method: "交叉分析",
          core: checks[1] ? [1, 5] : [1],
          dimensions: checks[1] ? [0] : [],
          outputs: checks[2] ? [
            {type:"堆叠条形图",icon:"▥",title:"购买原因 × 使用经验",prompt:"以 Q1 为分组维度，展示 Q2 各购买原因的组内占比并标注样本量。"},
            {type:"管理层结论",icon:"T",title:"分层购买驱动结论",prompt:"先总结各人群最显著的购买驱动，再解释差异及其业务意义。"}
          ] : [{type:"管理层结论",icon:"T",title:"分层购买驱动结论",prompt:"总结不同使用经验人群的购买驱动差异。"}],
          generationPrompt: "面向咨询项目负责人输出。对比 Q1 人群在 Q2 购买原因与 Q6 复购意愿上的差异；明确样本量和证据边界，不将相关性表述为因果。"
        });
        target = 1;
      } else if (target !== -1) {
        const chapter = state.chapters[target];
        if (checks[1]) {
          chapter.core = [...new Set([...chapter.core, 1, 5])];
          chapter.dimensions = [...new Set([...chapter.dimensions, 0])];
        }
        if (checks[2] && !chapter.outputs.some(output => output.type === "堆叠条形图")) {
          chapter.outputs.push({type:"堆叠条形图",icon:"▥",title:"购买原因 × 使用经验",prompt:"以 Q1 为分组维度，展示 Q2 各购买原因的组内占比并标注样本量。"});
          chapter.outputs.push({type:"管理层结论",icon:"T",title:"分层购买驱动结论",prompt:"先总结各人群最显著的购买驱动，再解释差异及其业务意义。"});
        }
      }
      if (target !== -1) state.chapter = target;
      state.aiProposalOpen = false;
      state.templateDiffOpen = false;
      state.templateSaved = false;
      render();
      toast(`已应用 ${checks.filter(Boolean).length} 项 AI 变更，请确认后保存`);
    }

    function handleAction(action, element) {

        state.selectedQuestion = Number(element.dataset.questionIndex);

      if (action === "home") {

        render();
      } else if (action === "create-template") {

        toast("账号：shen");

        setDashboard("my");

        closePreview();

        toast("问卷修改已保存");

        toast("已添加一条待编辑的诊断假设");
      } else if (action === "add-option") {
        const current = state.questions[state.selectedQuestion];

        renderPreservingScroll();
      } else if (action === "nps-preview") {
        toast(`NPS 预览选择：${element.textContent}`);
      } else if (action === "rating-preview") {
        toast(`评分预览选择：${element.dataset.rating} 星`);
      } else if (action === "preview-rating" || action === "preview-nps") {
        const questionIndex = Number(element.dataset.previewQuestion);
        state.previewAnswers[questionIndex] = Number(element.dataset.previewValue);
        $$(`[data-preview-question="${questionIndex}"][data-action]`).forEach(button => button.classList.toggle("selected", button === element));
        updatePreviewProgress();
      } else if (action === "submit-preview") {

        state.advancedOpen = !state.advancedOpen;

      } else if (action === "ai-details") {
        state.aiDetailsOpen = !state.aiDetailsOpen;
        render();
      } else if (action === "chapter-settings") {
        state.chapterSettingsOpen = !state.chapterSettingsOpen;
        render();
      } else if (action === "source-toggle") {
        state.templateSourcesOpen = !state.templateSourcesOpen;
        render();
      } else if (action === "module-menu") {
        toast("模块菜单：复制、替换类型、删除模块");
      } else if (action === "publish-section") {
        state.publishSection = Number(element.dataset.publishSection);
        render();
        toast(["发布状态", "回收范围", "回收规则", "完成页面"][state.publishSection]);
      } else if (action === "add-response-view") {
        state.customResponseViews.push(`自定义视图 ${state.customResponseViews.length + 1}`);
        state.responseView = 4 + state.customResponseViews.length;
        render();
        toast("已添加自定义答卷视图");
      } else if (action === "response-view") {
        state.responseView = Number(element.dataset.responseView);
        render();
      } else if (action === "filter-responses") {
        state.responseQuery = $("#responseSearch")?.value.trim() || "";
        render();
        toast(state.responseQuery ? `已筛选：${state.responseQuery}` : "已显示全部答卷");
      } else if (action === "close-response") {
        state.responseDetailOpen = false;
        render();
      } else if (action === "previous-page") {
        state.responsePage = Math.max(1, state.responsePage - 1);
        render();
      } else if (action === "select-page") {
        state.responsePage = Number(element.dataset.page);
        render();
      } else if (action === "next-page") {
        state.responsePage = Math.min(5, state.responsePage + 1);
        render();
      } else if (action === "select-report-chapter") {
        state.reportChapter = Number(element.dataset.reportChapter);
        state.reportEditing = false;
        $$(".report-side .outline-item").forEach((item) => item.classList.toggle("active", item === element));

      } else if (action === "add-question") {
        state.questions.push({ title: `问题 ${state.questions.length + 1}`, type: "短文本", required: false, desc: "", placeholder: "请输入……" });
        state.selectedQuestion = state.questions.length - 1;
        markDirty();
        render();
        $("#workspace").scrollTop = $("#workspace").scrollHeight;
        toast("已添加新问题");
      } else if (action === "duplicate-question") {
        const current = state.questions[state.selectedQuestion];
        state.questions.splice(state.selectedQuestion + 1, 0, {...current, options: current.options ? [...current.options] : undefined});
        state.selectedQuestion += 1; markDirty(); renderPreservingScroll(); toast("问题已复制");
      } else if (action === "delete-question") {
        if (state.questions.length === 1) return toast("至少保留一个问题");
        state.questions.splice(state.selectedQuestion, 1);
        state.selectedQuestion = Math.max(0, state.selectedQuestion - 1);
        markDirty(); renderPreservingScroll(); toast("问题已删除");
      } else if (action === "move-up") moveQuestion(-1);
      else if (action === "move-down") moveQuestion(1);
      else if (action === "collapse-ai") { state.aiCollapsed = true; render(); }
      else if (action === "expand-ai") { state.aiCollapsed = false; render(); }
      else if (action === "collapse-side") {
        state.sideCollapsed = !state.sideCollapsed;
        render();
      } else if (action === "ai-send") {
        const input = $("#aiInput");
        if (!input || !input.value.trim()) return toast("请输入希望 AI 调整的内容");
        if (state.step === "template") {
          state.aiProposalOpen = true;
          state.proposalChecks = [true, true, true];
          render();
          toast("AI 已生成 3 项待确认变更");

      } else if (action === "ai-preview") {

          markDirty();

      else if (action === "add-chapter") {

          title: `新分析章节 ${state.chapters.length + 1}`,

          method: "描述性统计",
          core: [],
          dimensions: [],
          outputs: [{type:"管理层结论",icon:"T",title:"章节结论",prompt:"先给出结论，再列出数据证据与业务含义。"}],

        });
        state.chapter = state.chapters.length - 1;
        state.templateSaved = false;
        render();

        render();

          {type:"堆叠条形图",icon:"▥",title:"人群分组对比",prompt:"按当前维度对核心题做组内百分比对比，并标注每组样本量。"},

        ];

    function openPreview() {
      const previewUrl = `${location.href.split("#")[0]}#preview`;
      const previewTab = window.open(previewUrl, "_blank");
      if (previewTab) {
        toast("已在新标签页打开预览");
        return;
      }
      state.step = "design";
      state.previewing = true;
      render();
      history.replaceState(null, "", "#preview");
      toast("浏览器阻止了新标签页，已在当前页打开预览");
    }

    function closePreview() {
      if (!state.previewing) return;
      if (window.opener && !window.opener.closed) {
        window.close();
        return;
      }
      state.previewing = false;
      render();
      history.replaceState(null, "", "#design");
    }

    $$(".step").forEach(step => step.onclick = () => setStep(step.dataset.step));
    $("#previewBtn").onclick = openPreview;
    $("#saveBtn").onclick = () => handleAction("save-changes", $("#saveBtn"));
    $("#backBtn").onclick = () => setDashboard("my");
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      closePreview();
      if (state.questionPickerOpen || state.outputPickerOpen || state.templateDiffOpen || state.templatePreviewOpen) {
        state.questionPickerOpen = false;
        state.outputPickerOpen = false;
        state.templateDiffOpen = false;
        state.templatePreviewOpen = false;
        render();
      }
      if (state.createModal) {
        state.createModal = false;
        render();
      }
    });

    const initial = location.hash.slice(1);
    if (["design","template","publish","responses","report"].includes(initial)) state.step = initial;
    if (initial === "template") state.sideCollapsed = false;
    if (initial === "preview") {
      state.step = "design";
      state.previewing = true;
    }
    if (["home","my","templates","reportTemplates","insights"].includes(initial)) {
      state.step = "home";
      state.dashboardView = initial;
    }
    render();
  </script>
</body>
</html>
