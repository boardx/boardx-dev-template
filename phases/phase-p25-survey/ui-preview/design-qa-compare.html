<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>设计问卷同屏对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #181818; color: #fff; font: 14px Arial, sans-serif; }
    header, main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 12px 0; }
    main { padding-top: 0; }
    figure { margin: 0; overflow: hidden; background: #fff; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <header><strong>参考设计问卷</strong><strong>HTML 原型</strong></header>
  <main>
    <figure><img src="source-design-reference-latest.png" alt="参考设计问卷"></figure>
    <figure><img src="prototype-current-design-2048.png" alt="HTML 原型"></figure>
  </main>
</body>
</html>
