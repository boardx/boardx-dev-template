<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Survey collect design comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f2f2f2; font-family: Arial, sans-serif; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #d8d8d8; background: white; }
      figcaption { padding: 10px 12px; border-bottom: 1px solid #d8d8d8; font-size: 14px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Selected reference</figcaption>
        <img src="../../../ui-preview/collect-simplified-selected.png" alt="Selected collect design" />
      </figure>
      <figure>
        <figcaption>Implemented workspace</figcaption>
        <img src="./survey-collect-simplified-desktop.png" alt="Implemented collect workspace" />
      </figure>
    </main>
  </body>
</html>
